<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#0D1015" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <!-- Home-screen install on iOS Safari (no beforeinstallprompt there): run
         standalone/fullscreen so a launched PWA has no browser chrome. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Planet Rush" />
    <title>Planet Rush</title>

    <!-- The two ratified faces, SELF-HOSTED (GDD §5.6) — never a CDN. The game
         must run offline (§4.3/§4.8) and the strict artifact hosts these builds
         are reviewed on do not allow a third-party font-src. Provenance, the
         subset and the licences: public/fonts/README.md. `crossorigin` is
         required on a font preload even same-origin — without it the browser
         fetches the file a second time and the preload buys nothing. -->
    <link
      rel="preload"
      href="./fonts/Audiowide-Regular-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="./fonts/Oxanium-Variable-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      /* Audiowide — wordmark, headings, menu confirmations. Upstream ships one
         weight (Regular); a bold heading is synthesised, as it always was. */
      @font-face {
        font-family: 'Audiowide';
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url('fonts/Audiowide-Regular-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
          U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215,
          U+FEFF, U+FFFD;
      }
      /* Oxanium — HUD numerals and body text. One VARIABLE file covers the whole
         `wght` axis, so `normal` and `bold` are real instances rather than a
         synthetic smear and cost no second download. The range is not optional:
         the font's own default instance is 200 (ExtraLight), so a face declared
         without it would render the entire HUD hairline-thin. */
      @font-face {
        font-family: 'Oxanium';
        font-style: normal;
        font-weight: 200 800;
        font-display: block;
        src: url('fonts/Oxanium-Variable-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
          U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215,
          U+FEFF, U+FFFD;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #0d1015;
        /* Respect notches / punch-holes (mobile amendment §1). */
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      #app {
        width: 100%;
        height: 100%;
      }
    </style>
    <script type="module" crossorigin src="./assets/index-B27ydMYH.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/typography-CVMcRgo2.js">
  </head>
  <body>
    <div id="app"></div>
    <!--
      FIRST PAINT IS BLOCKED ON THE FACES, NOT LEFT TO RACE THEM (u14-01).

      The reasoning lives with the code, in src/ui/font-boot.ts — in short: this
      game draws its text into a canvas, where `font-display` does nothing, so a
      frame composited before the woff2 decodes is baked into a texture that is
      never redrawn. Only the ORDER is this file's business, and it is the whole
      point: `awaitRatifiedFaces` is awaited BEFORE `src/main.ts` is imported, so
      the module that builds the renderer is not evaluated until the faces are in.

      The static import is bundled into this entry chunk, so it costs no extra
      request; `src/main.ts` stays a dynamic import because that is the only form
      that actually defers evaluation (a top-level `await` in a sibling static
      import does NOT hold back the sibling listed after it — tested).
    -->
  </body>
</html>
