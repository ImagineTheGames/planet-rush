document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

       <div style=\"position:absolute;left:0;right:0;bottom:0;height:6.5%;background:linear-gradient(180deg,#7e8894,#40464e);\"><\u002Fdiv>\n        <div style=\"position:absolute;left:0;right:0;bottom:6.5%;height:2px;background:rgba(238,242,247,.3);\"><\u002Fdiv>\n        <div style=\"position:absolute;left:0;right:0;bottom:0;height:2.4%;opacity:{{ hazOp }};transition:opacity .34s ease-out;background:repeating-linear-gradient(115deg, rgba(242,210,75,.44) 0 9px, rgba(38,42,49,.94) 9px 18px);\"><\u002Fdiv>\n        <div style=\"position:absolute;left:6%;right:6%;bottom:calc(min(74px,8.5vh) + {{ lockGap }});display:flex;justify-content:center;isolation:isolate;\">\n          <span style=\"{{ titleStyleCss }}\">STAR<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- LOWER LEAF -->\n      <div style=\"position:absolute;left:0;right:0;bottom:0;height:50%;transform:{{ leafBotT }};transition:transform 1.02s cubic-bezier(.62,.02,.28,1);background:linear-gradient(22deg,#515861 0%,#383e45 44%,#262a31 100%);\">\n        <div style=\"position:absolute;inset:0;background:repeating-linear-gradient(90deg, rgba(1,2,4,.22) 0 1px, transparent 1px 12.5%);\"><\u002Fdiv>\n        <div style=\"position:absolute;left:6%;right:6%;bottom:14%;height:2px;background:linear-gradient(90deg,transparent,rgba(1,2,4,.5) 12%,rgba(1,2,4,.5) 88%,transparent);\"><\u002Fdiv>\n        <div style=\"position:absolute;left:6%;right:6%;bottom:calc(14% + 2px);height:1px;background:linear-gradient(90deg,transparent,rgba(238,242,247,.12) 12%,rgba(238,242,247,.12) 88%,transparent);\"><\u002Fdiv>\n        <div style=\"position:absolute;left:0;right:0;top:0;height:6.5%;background:linear-gradient(0deg,#7e8894,#383e45);\"><\u002Fdiv>\n        <div style=\"position:absolute;left:0;right:0;top:6.5%;height:2px;background:rgba(238,242,247,.22);\"><\u002Fdiv>\n        <div style=\"position:absolute;left:0;right:0;top:0;height:2.4%;opacity:{{ hazOp }};transition:opacity .34s ease-out;background:repeating-linear-gradient(115deg, rgba(242,210,75,.44) 0 9px, rgba(38,42,49,.94) 9px 18px);\"><\u002Fdiv>\n        <div style=\"position:absolute;left:6%;right:6%;top:calc(min(74px,8.5vh) + {{ lockGap }});display:flex;justify-content:center;isolation:isolate;\">\n          <span style=\"{{ rushStyleCss }}\">RUSH<\u002Fspan>\n        <\u002Fdiv>\n\n\n      <\u002Fdiv>\n\n      <!-- the lock rides the upper leaf -->\n      <div style=\"position:absolute;left:0;right:0;top:0;height:50%;transform:{{ leafTopT }};transition:transform 1.02s cubic-bezier(.62,.02,.28,1);pointer-events:none;\">\n        <!-- THE LOCK ─────────────────────────────────────────────────────\n             What made this read as a toy was flat fills, high contrast between a few\n             big shapes, and sitting ON the door. Real machined steel is the opposite:\n             it sits IN a bored pocket, its value range is narrow, and it earns its\n             realism from small things — turning marks from the lathe, a specular\n             streak that crosses the form, a hex drive that is clearly driven by a\n             tool, index marks that say which way it has turned, and screws that\n             actually hold the flange on. -->\n        <div style=\"position:absolute;left:50%;bottom:0;width:min(148px,17vh);aspect-ratio:1;transform:translate(-50%,50%) scale({{ hubScale }});transition:transform .5s ease-out;\">\n  \n          <!-- bored pocket: the mechanism is recessed into the leaf -->\n          <div style=\"position:absolute;inset:-9%;border-radius:50%;background:radial-gradient(circle,#1a1e24 62%,#2b3138 100%);box-shadow:inset 0 3px 7px rgba(1,2,4,.95), inset 0 -1px 0 rgba(238,242,247,.14), 0 1px 0 rgba(238,242,247,.1);\"><\u002Fdiv>\n  \n          <!-- flange, with the fasteners that hold it down -->\n          <div style=\"position:absolute;inset:-4%;border-radius:50%;background:linear-gradient(158deg,#697179,#343a41 72%);box-shadow:inset 0 1px 0 rgba(238,242,247,.3), 0 2px 5px rgba(1,2,4,.8);\"><\u002Fdiv>\n          <div style=\"position:absolute;inset:-4%;border-radius:50%;background:repeating-conic-gradient(from 0deg, rgba(1,2,4,.1) 0deg 1.6deg, transparent 1.6deg 6deg);\"><\u002Fdiv>\n            <div style=\"position:absolute;left:50%;top:50%;width:6.4%;height:6.4%;margin:-3.2% 0 0 -3.2%;transform:rotate(0deg) translateY(-43%);\">\n              <div style=\"width:100%;height:100%;border-radius:50%;background:linear-gradient(155deg,#8b939b,#3a4047);box-shadow:inset 0 .5px 0 rgba(238,242,247,.45), 0 1px 2px rgba(1,2,4,.8);\"><\u002Fdiv>\n              <div style=\"position:absolute;left:24%;right:24%;top:47%;height:1px;background:rgba(1,2,4,.75);\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"position:absolute;left:50%;top:50%;width:6.4%;height:6.4%;margin:-3.2% 0 0 -3.2%;transform:rotate(60deg) translateY(-43%);\">\n              <div style=\"width:100%;height:100%;border-radius:50%;background:linear-gradient(155deg,#8b939b,#3a4047);box-shadow:inset 0 .5px 0 rgba(238,242,247,.45), 0 1px 2px rgba(1,2,4,.8);\"><\u002Fdiv>\n              <div style=\"position:absolute;left:24%;right:24%;top:47%;height:1px;background:rgba(1,2,4,.75);\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"position:absolute;left:50%;top:50%;width:6.4%;height:6.4%;margin:-3.2% 0 0 -3.2%;transform:rotate(120deg) translateY(-43%);\">\n              <div style=\"width:100%;height:100%;border-radius:50%;background:linear-gradient(155deg,#8b939b,#3a4047);box-shadow:inset 0 .5px 0 rgba(238,242,247,.45), 0 1px 2px rgba(1,2,4,.8);\"><\u002Fdiv>\n              <div style=\"position:absolute;left:24%;right:24%;top:47%;height:1px;background:rgba(1,2,4,.75);\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"position:absolute;left:50%;top:50%;width:6.4%;height:6.4%;margin:-3.2% 0 0 -3.2%;transform:rotate(180deg) translateY(-43%);\">\n              <div style=\"width:100%;height:100%;border-radius:50%;background:linear-gradient(155deg,#8b939b,#3a4047);box-shadow:inset 0 .5px 0 rgba(238,242,247,.45), 0 1px 2px rgba(1,2,4,.8);\"><\u002Fdiv>\n              <div style=\"position:absolute;left:24%;right:24%;top:47%;height:1px;background:rgba(1,2,4,.75);\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"position:absolute;left:50%;top:50%;width:6.4%;height:6.4%;margin:-3.2% 0 0 -3.2%;transform:rotate(240deg) translateY(-43%);\">\n              <div style=\"width:100%;height:100%;border-radius:50%;background:linear-gradient(155deg,#8b939b,#3a4047);box-shadow:inset 0 .5px 0 rgba(238,242,247,.45), 0 1px 2px rgba(1,2,4,.8);\"><\u002Fdiv>\n              <div style=\"position:absolute;left:24%;right:24%;top:47%;height:1px;background:rgba(1,2,4,.75);\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"position:absolute;left:50%;top:50%;width:6.4%;height:6.4%;margin:-3.2% 0 0 -3.2%;transform:rotate(300deg) translateY(-43%);\">\n              <div style=\"width:100%;height:100%;border-radius:50%;background:linear-gradient(155deg,#8b939b,#3a4047);box-shadow:inset 0 .5px 0 rgba(238,242,247,.45), 0 1px 2px rgba(1,2,4,.8);\"><\u002Fdiv>\n              <div style=\"position:absolute;left:24%;right:24%;top:47%;height:1px;background:rgba(1,2,4,.75);\"><\u002Fdiv>\n            <\u002Fdiv>\n  \n          <!-- index marks cut into the flange: closed at the top, open a third round -->\n          <div style=\"position:absolute;left:50%;top:-7%;width:1.6%;height:7%;margin-left:-.8%;background:rgba(1,2,4,.8);box-shadow:.5px 0 0 rgba(238,242,247,.22);\"><\u002Fdiv>\n          <div style=\"position:absolute;left:50%;top:50%;width:1.6%;height:7%;margin-left:-.8%;transform:rotate(135deg) translateY(-57%);transform-origin:50% 0;background:rgba(242,210,75,.5);\"><\u002Fdiv>\n  \n          <!-- seat the rotor sits in -->\n          <div style=\"position:absolute;inset:4%;border-radius:50%;background:linear-gradient(158deg,#2b3138,#1c2027);box-shadow:inset 0 2px 5px rgba(1,2,4,.9);\"><\u002Fdiv>\n  \n          <!-- ROTOR -->\n          <div style=\"position:absolute;inset:13%;transform:rotate({{ hubRot }});transition:transform .86s cubic-bezier(.32,0,.18,1);\">\n            <div style=\"position:absolute;inset:0;clip-path:polygon(0 22%,13% 0,87% 0,100% 22%,100% 78%,87% 100%,13% 100%,0 78%);background:linear-gradient(154deg,#6d757e 0%,#565e66 40%,#474e56 62%,#3b4148 100%);box-shadow:inset 0 1px 0 rgba(238,242,247,.34);\"><\u002Fdiv>\n            <!-- turned from bar stock: fine concentric tool marks -->\n            <div style=\"position:absolute;inset:0;clip-path:polygon(0 22%,13% 0,87% 0,100% 22%,100% 78%,87% 100%,13% 100%,0 78%);background:repeating-radial-gradient(circle at 50% 50%, rgba(238,242,247,.06) 0 1px, rgba(1,2,4,.07) 1px 3px);\"><\u002Fdiv>\n            <!-- one specular streak crossing the whole form, which is what tells the\n                 eye this is metal and not paint -->\n            <div style=\"position:absolute;inset:0;clip-path:polygon(0 22%,13% 0,87% 0,100% 22%,100% 78%,87% 100%,13% 100%,0 78%);background:linear-gradient(116deg, transparent 26%, rgba(238,242,247,.2) 44%, rgba(238,242,247,.05) 52%, transparent 66%);\"><\u002Fdiv>\n            <div style=\"position:absolute;inset:0;clip-path:polygon(0 22%,13% 0,87% 0,100% 22%,100% 78%,87% 100%,13% 100%,0 78%);box-shadow:inset 0 -2px 0 rgba(1,2,4,.45), inset 0 2px 0 rgba(238,242,247,.16);\"><\u002Fdiv>\n  \n            <!-- drive slots: shallow, chamfered, with a lit lower lip -->\n            <div style=\"position:absolute;left:50%;top:5%;width:3.6%;height:28%;margin-left:-1.8%;background:linear-gradient(180deg,rgba(1,2,4,.66),rgba(1,2,4,.3));box-shadow:1px 0 0 rgba(238,242,247,.2);\"><\u002Fdiv>\n            <div style=\"position:absolute;left:50%;bottom:5%;width:3.6%;height:28%;margin-left:-1.8%;background:linear-gradient(0deg,rgba(1,2,4,.66),rgba(1,2,4,.3));box-shadow:1px 0 0 rgba(238,242,247,.2);\"><\u002Fdiv>\n            <div style=\"position:absolute;top:50%;left:5%;height:3.6%;width:28%;margin-top:-1.8%;background:linear-gradient(90deg,rgba(1,2,4,.66),rgba(1,2,4,.3));box-shadow:0 1px 0 rgba(238,242,247,.2);\"><\u002Fdiv>\n            <div style=\"position:absolute;top:50%;right:5%;height:3.6%;width:28%;margin-top:-1.8%;background:linear-gradient(270deg,rgba(1,2,4,.66),rgba(1,2,4,.3));box-shadow:0 1px 0 rgba(238,242,247,.2);\"><\u002Fdiv>\n  \n            <!-- raised boss, then the hex socket a tool actually engages -->\n            <div style=\"position:absolute;left:50%;top:50%;width:36%;height:36%;margin:-18% 0 0 -18%;border-radius:50%;background:linear-gradient(154deg,#7e8894 0%,#5a626b 46%,#40464e 100%);box-shadow:inset 0 1px 0 rgba(238,242,247,.42), 0 1px 3px rgba(1,2,4,.7);\"><\u002Fdiv>\n            <div style=\"position:absolute;left:50%;top:50%;width:34%;height:34%;margin:-17% 0 0 -17%;border-radius:50%;background:repeating-radial-gradient(circle at 50% 50%, rgba(1,2,4,.06) 0 1px, transparent 1px 2px);\"><\u002Fdiv>\n            <div style=\"position:absolute;left:50%;top:50%;width:15%;height:16.5%;margin:-8.25% 0 0 -7.5%;background:#171b21;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);box-shadow:0 1px 0 rgba(238,242,247,.2);\"><\u002Fdiv>\n            <div style=\"position:absolute;left:50%;top:50%;width:15%;height:16.5%;margin:-8.25% 0 0 -7.5%;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);box-shadow:inset 0 1.5px 1px rgba(1,2,4,.9);\"><\u002Fdiv>\n  \n            <!-- engraved witness line: which way it has been turned -->\n            <div style=\"position:absolute;left:50%;top:6%;width:1.4%;height:14%;margin-left:-.7%;background:rgba(1,2,4,.7);box-shadow:.5px 0 0 rgba(238,242,247,.26);\"><\u002Fdiv>\n          <\u002Fdiv>\n  \n          <!-- grime in the crevice, and the rim highlight over everything -->\n          <div style=\"position:absolute;inset:4%;border-radius:50%;pointer-events:none;box-shadow:inset 0 0 5px rgba(1,2,4,.6);\"><\u002Fdiv>\n          <div style=\"position:absolute;inset:-4%;border-radiu or&quot;:&quot;range&quot;,&quot;default&quot;:5,&quot;min&quot;:0,&quot;max&quot;:24,&quot;step&quot;:1,&quot;unit&quot;:&quot;s&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Animation&quot;,&quot;label&quot;:&quot;Sheen sweep&quot;,&quot;subtitle&quot;:&quot;0 = off; pause between passes&quot;},&quot;titleSize&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:150,&quot;min&quot;:60,&quot;max&quot;:150,&quot;step&quot;:1,&quot;unit&quot;:&quot;%&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Title&quot;,&quot;label&quot;:&quot;Size&quot;},&quot;titleTracking&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:7,&quot;min&quot;:0,&quot;max&quot;:40,&quot;step&quot;:1,&quot;unit&quot;:&quot;/100 em&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Title&quot;,&quot;label&quot;:&quot;Letter spacing&quot;},&quot;outlineWidth&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:9,&quot;min&quot;:-1,&quot;max&quot;:9,&quot;step&quot;:1,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Title&quot;,&quot;label&quot;:&quot;Outline weight&quot;,&quot;subtitle&quot;:&quot;−1 follows the preset&quot;},&quot;outlineColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;options&quot;:[&quot;#1c2027&quot;,&quot;#010204&quot;,&quot;#5a626b&quot;,&quot;#4dc3ff&quot;],&quot;default&quot;:&quot;#1c2027&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Title&quot;,&quot;label&quot;:&quot;Outline colour&quot;},&quot;glow&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:3,&quot;min&quot;:-1,&quot;max&quot;:48,&quot;step&quot;:1,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Title&quot;,&quot;label&quot;:&quot;Glow&quot;,&quot;subtitle&quot;:&quot;−1 follows the preset&quot;},&quot;glowColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;options&quot;:[&quot;#010204&quot;,&quot;#1c2027&quot;,&quot;#a3b2c4&quot;,&quot;#eef2f7&quot;,&quot;#4dc3ff&quot;,&quot;#f2d24b&quot;,&quot;#e0a878&quot;],&quot;default&quot;:&quot;#010204&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Title&quot;,&quot;label&quot;:&quot;Glow colour&quot;,&quot;subtitle&quot;:&quot;black reads as a soft shadow halo&quot;},&quot;lockGap&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:3,&quot;min&quot;:2,&quot;max&quot;:22,&quot;step&quot;:1,&quot;unit&quot;:&quot;%&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Title&quot;,&quot;label&quot;:&quot;Clearance from the lock&quot;}}\">\nclass Component extends DCLogic {\n  state = { phase: 'locked' };\n\n  /* A stable identity, assigned once. Returning a fresh arrow from renderVals()\n     makes React detach and reattach the ref on every render, so this._leaf was\n     never reliably pointing at a live node when a listener was bound to it. */\n  setLeaf = (el) => { this._leaf = el; };\n\n  /* Stable, for the same reason as the leaf: a fresh arrow from renderVals() makes\n     React null and re-set the ref every render, which re-sized (and so re-cleared)\n     the canvas repeatedly — the sky came up black and only filled in once a later\n     paint happened to land. */\n  setSky = (el) => {\n    if (!el || el === this._sky) return;\n    this._sky = el;\n    this.sizeSky();\n  };\n\n  setSkyBack = (el) => {\n    if (!el || el === this._skyBack) return;\n    this._skyBack = el;\n    this.sizeSky();\n  };\n\n  /** The leaf's real vertical offset right now, mid-transition. */\n  leafOffset() {\n    if (!this._leaf) return 0;\n    const t = getComputedStyle(this._leaf).transform;\n    const m = /matrix\\(([^)]+)\\)/.exec(t);\n    if (!m) return 0;\n    const p = m[1].split(',');\n    return Math.abs(parseFloat(p[5]) || 0);\n  }\n\n  /* ── glass cue engine, carried over from the UI direction ──────── */\n  ac() {\n    if (!this._ac) {\n      const C = window.AudioContext || window.webkitAudioContext;\n      if (!C) return null;\n      this._ac = new C();\n      this._master = this._ac.createGain();\n      this._master.gain.value = 0.5;\n      this._master.connect(this._ac.destination);\n    }\n    if (this._ac.state === 'suspended') this._ac.resume();\n    return this._ac;\n  }\n\n  verb() {\n    const ac = this.ac();\n    if (!ac) return null;\n    if (!this._verb) {\n      const len = Math.floor(ac.sampleRate * 2.2);\n      const buf = ac.createBuffer(2, len, ac.sampleRate);\n      for (let ch = 0; ch < 2; ch++) {\n        const d = buf.getChannelData(ch);\n        for (let i = 0; i < len; i++) {\n          const x = i / len;\n          d[i] = (Math.random() * 2 - 1) * Math.pow(1 - x, 2.1) * (1 - Math.exp(-i / 220));\n        }\n      }\n      const cv = ac.createConvolver();\n      cv.buffer = buf;\n      const hp = ac.createBiquadFilter();\n      hp.type = 'highpass';\n      hp.frequency.value = 620;\n      const wet = ac.createGain();\n      wet.gain.value = 0.25;\n      cv.connect(hp).connect(wet).connect(this._master);\n      this._verb = cv;\n    }\n    return this._verb;\n  }\n\n  noiseBuf() {\n    const ac = this.ac();\n    if (!this._nb) {\n      const n = Math.floor(ac.sampleRate * 3);\n      this._nb = ac.createBuffer(1, n, ac.sampleRate);\n      const d = this._nb.getChannelData(0);\n      for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;\n    }\n    return this._nb;\n  }\n\n  ping({ at = 0, f = 1661, dur = 0.3, gain = 0.08, parts = [1, 2.76, 5.4], wet = 0.36, strike = 0.002 } = {}) {\n    const ac = this.ac();\n    if (!ac) return;\n    const t = ac.currentTime + at;\n    parts.forEach((mul, i) => {\n      const o = ac.createOscillator();\n      o.type = 'sine';\n      o.frequency.setValueAtTime(f * mul, t);\n      const g = ac.createGain();\n      const amp = gain / Math.pow(i + 1, 1.45);\n      g.gain.setValueAtTime(0.0001, t);\n      g.gain.linearRampToValueAtTime(amp, t + strike);\n      g.gain.exponentialRampToValueAtTime(0.0001, t + dur * Math.pow(0.66, i));\n      o.connect(g).connect(this._master);\n      const w = this.verb();\n      if (w && wet > 0) {\n        const wg = ac.createGain();\n        wg.gain.value = wet;\n        g.connect(wg).connect(w);\n      }\n      o.start(t);\n      o.stop(t + dur + 0.05);\n    });\n  }\n\n  sub({ at = 0, f0 = 104, f1 = 74, dur = 0.09, gain = 0.1 } = {}) {\n    const ac = this.ac();\n    if (!ac) return;\n    const t = ac.currentTime + at;\n    const o = ac.createOscillator();\n    o.type = 'sine';\n    o.frequency.setValueAtTime(f0, t);\n    o.frequency.exponentialRampToValueAtTime(f1, t + dur);\n    const g = ac.createGain();\n    g.gain.setValueAtTime(0.0001, t);\n    g.gain.linearRampToValueAtTime(gain, t + 0.006);\n    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);\n    o.connect(g).connect(this._master);\n    o.start(t);\n    o.stop(t + dur + 0.05);\n  }\n\n  /** Pressure relief: broadband noise whose FILTER falls as pressure drops. */\n  hiss({ at = 0, dur = 1.5, f0 = 5000, f1 = 700, gain = 0.09, q = 0.5, wet = 0.45 } = {}) {\n    const ac = this.ac();\n    if (!ac) return;\n    const t = ac.currentTime + at;\n    const src = ac.createBufferSource();\n    src.buffer = this.noiseBuf();\n    src.loop = true;\n    const bp = ac.createBiquadFilter();\n    bp.type = 'bandpass';\n    bp.Q.value = q;\n    bp.frequency.setValueAtTime(f0, t);\n    bp.frequency.exponentialRampToValueAtTime(f1, t + dur);\n    const hp = ac.createBiquadFilter();\n    hp.type = 'highpass';\n    hp.frequency.value = 320;\n    const g = ac.createGain();\n    g.gain.setValueAtTime(0.0001, t);\n    g.gain.linearRampToValueAtTime(gain, t + 0.03);\n    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);\n    src.connect(bp).connect(hp).connect(g).connect(this._master);\n    const w = this.verb();\n    if (w && wet > 0) {\n      const wg = ac.createGain();\n      wg.gain.value = wet;\n      g.connect(wg).connect(w);\n    }\n    src.start(t);\n    src.stop(t + dur + 0.08);\n  }\n\n  cue(kind) {\n    if (!this.ac()) return;\n    const v = 0.971 + Math.random() * 0.058;\n    if (kind === 'hover') {\n      this.ping({ f: 3520, dur: 0.16, gain: 0.038, wet: 0.34 });\n    } else if (kind === 'confirm') {\n      this.ping({ f: 1661 * v, dur: 0.3, gain: 0.075 });\n      this.ping({ at: 0.045, f: 2489 * v, dur: 0.22, gain: 0.05, parts: [1, 2.76], wet: 0.34 });\n      this.sub({ gain: 0.055 });\n    } else if (kind === 'select') {\n      this.ping({ f: 1661 * v, dur: 0.19, gain: 0.05, wet: 0.3 });\n    } else if (kind === 'unlock') {\n      /* The order the machine actually works in: valve cracks, compartment vents,\n         the lock ratchets round, the bolts pull, and the weight moves last. */\n      this.hiss({ dur: 0.2, f0: 7600, f1: 3000, gain: 0.11, q: 0.8, wet: 0.3 });\n      this.hiss({ at: 0.05, dur: 1.7, f0: 4800, f1: 620, gain: 0.1 });\n      // the lock turning: seven ratchet detents, not a servo whine\n      for (let i = 0; i < 7; i++) {\n        this.ping({ at: 0.14 + i * 0.098, f: 2637 * v, dur: 0.09, gain: 0.036, parts: [1, 4.2], wet: 0.22, strike: 0.001 });\n      }\n      this.ping({ at: 0.86, f: 1661 * v, dur: 0.3, gain: 0.062 });\n      this.hiss({ at: 0.92, dur: 0.9, f0: 3200, f1: 480, gain: 0.075, q: 0.4 });\n      this.sub({ at: 0.94, f0: 116, f1: 48, dur: 0.6, gain: 0.17 });\n    } else if (kind === 'seated') {\n      this.ping({ f: 1661 * v, dur: 0.9, gain: 0.055, wet: 0.5 });\n      this.ping({ f: 2489 * v, dur: 0.7, gain: 0.04, parts: [1, 2.76], wet: 0.5 });\n      this.ping({ f: 3322 * v, dur: 0.55, gain: 0.03, parts: [1, 2.76], wet: 0.5 });\n    }\n  }\n\n  /* ── backdrop: Floor, seeded bloom, one nebula ─────────────────── */\n  makeStars(w, h) {\n    let a = 20260814;\n    const rnd = () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };\n    const n = Math.round((w * h) / 5200);\n    this.stars = [];\n    for (let i = 0; i < n; i++) {\n      const m = rnd();\n      // depth drives both drift speed and size, so the field reads as parallax\n      const depth = 0.25 + m * m;\n      this.stars.push({ x: rnd(), y: rnd(), r: 0.35 + m * m * 1.5, a: 0.22 + m * 0.62,\n        bloom: rnd() < 0.045, tw: rnd() * 6.283, tws: 0.5 + rnd(),\n        depth, fp: 5 + rnd() * 22, fo: rnd() * 25 });\n    }\n  }\n\n  sizeSky() {\n    const cv = this._sky;\n    if (!cv) return;\n    const dpr = Math.min(2, window.devicePixelRatio || 1);\n    const w = cv.clientWidth || window.innerWidth;\n    const h = cv.clientHeight || window.innerHeight;\n    const fit = (c) => {\n      if (!c) return null;\n      c.width = Math.round(w * dpr);\n      c.height = Math.round(h * dpr);\n      const g = c.getContext('2d');\n      g.setTransform(dpr, 0, 0, dpr, 0, 0);\n      return g;\n    };\n    this.skyCtx = fit(cv);\n    this.backCtx = fit(this._skyBack);\n    this.skyW = w; this.skyH = h;\n    this.makeStars(w, h);\n    // sizing a canvas clears it, so paint here rather than waiting on a frame\n    this.paintSky(0);\n  }\n\n  paintSky(t) {\n    if (!this.stars) return;\n    // the field behind the menu is never punched, so the doorway has stars in it\n    if (this.backCtx) this.drawField(this.backCtx, t, false);\n    if (this.skyCtx) this.drawField(this.skyCtx, t, true);\n  }\n\n  drawField(g, t, punch) {\n    const w = this.skyW, h = this.skyH;\n    g.fillStyle = '#010204';\n    g.fillRect(0, 0, w, h);\n    const nb = g.createRadialGradient(w * 0.74, h * 0.26, 0, w * 0.74, h * 0.26, Math.max(w, h) * 0.6);\n    nb.addColorStop(0, 'rgba(79,160,139,0.09)');\n    nb.addColorStop(0.5, 'rgba(79,160,139,0.03)');\n    nb.addColorStop(1, 'rgba(1,2,4,0)');\n    g.fillStyle = nb;\n    g.fillRect(0, 0, w, h);\n    const ms = t || 0;\n    for (const s of this.stars) {\n      let tw = 0.82 + 0.18 * Math.sin(ms * 0.0009 * s.tws + s.tw);\n      /* An occasional hard flicker on top of the slow twinkle. Rare and short — a\n         field where everything shimmers reads as noise; one star catching now and\n         then is what makes it feel like a real sky being travelled through. */\n      const f = ((ms / 1000 + s.fo) % s.fp) / s.fp;\n      if (f < 0.035) tw += 1.5 * Math.sin((f / 0.035) * Math.PI);\n      // slow drift, faster for near stars — the rig is under way\n      const x = (((s.x + ms * 0.0000042 * s.depth) % 1) + 1) % 1 * w;\n      const y = s.y * h;\n      if (s.bloom) {\n        g.globalAlpha = s.a * tw * 0.22;\n        g.fillStyle = '#cfd8e3';\n        g.beginPath(); g.arc(x, y, s.r * 5.5, 0, 6.283); g.fill();\n      }\n      g.globalAlpha = Math.min(1, s.a * tw);\n      g.fillStyle = '#e6ecf4';\n      g.beginPath(); g.arc(x, y, s.r * (tw > 1 ? 1.5 : 1), 0, 6.283); g.fill();\n    }\n    g.globalAlpha = 1;\n\n    /* Punch the doorway out of the sky. The starfield is painted OVER the menu so\n       that the vacuum around the hull is vacuum and not UI; clearing the opening is\n       what makes the doorway the one place the interior shows. It tracks the same\n       geometry the CSS uses, including the through-scale. */\n    if (punch && this.state.phase !== 'open') {\n      const sc = (this.state.phase === 'entering' ? this.throughScale() : 1);\n      const dw = Math.min(0.94 * w, 1.36 * h) * sc;\n      const dh = (dw / 1.62);\n      const x0 = w / 2 - dw / 2, y0 = h / 2 - dh / 2;\n      const pts = [[0, 0.22], [0.13, 0], [0.87, 0], [1, 0.22], [1, 0.78], [0.87, 1], [0.13, 1], [0, 0.78]];\n      g.save();\n      g.globalCompositeOperation = 'destination-out';\n      g.beginPath();\n      pts.forEach(([px, py], i) => {\n        const X = x0 + px * dw, Y = y0 + py * dh;\n        if (i) g.lineTo(X, Y); else g.moveTo(X, Y);\n      });\n      g.closePath();\n      g.fill();\n      g.restore();\n    }\n  }\n\n  componentDidMount() {\n    // size once more after first layout, so the field is complete on the first frame\n    requestAnimationFrame(() => this.sizeSky());\n    this._loop = (t) => { this.paintSky(t); this._raf = requestAnimationFrame(this._loop); };\n    this._raf = requestAnimationFrame(this._loop);\n    // the through-scale is derived from the viewport, so a resize must recompute it\n    this._ro = () => { this.sizeSky(); this.forceUpdate(); };\n    window.addEventListener('resize', this._ro);\n    this._key = (e) => {\n      const locked = this.state.phase === 'locked';\n      if (locked && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); this.unlock(); }\n      else if (!locked && e.key === 'Escape') { e.preventDefault(); this.reseal(); }\n    };\n    window.addEventListener('keydown', this._key);\n  }\n\n  componentWillUnmount() {\n    cancelAnimationFrame(this._raf);\n    window.removeEventListener('resize', this._ro);\n    window.removeEventListener('keydown', this._key);\n    clearTimeout(this._t1); clearTimeout(this._t2); clearTimeout(this._t3);\n    cancelAnimationFrame(this._poll);\n  }\n\n  /** How far the door must scale for its OPENING to clear the viewport entirely.\n      Measured from the real window, because the door is min(94vw,136vh) wide at\n      1.62 — which branch wins differs between a desktop and a phone, and a fixed\n      factor that works on one leaves frame metal on screen on the other. */\n  throughScale() {\n    const vw = window.innerWidth, vh = window.innerHeight;\n    const doorW = Math.min(0.94 * vw, 1.36 * vh);\n    const doorH = doorW / 1.62;\n    const openW = doorW * 0.812, openH = doorH * 0.812;\n    return Math.min(16, 1.4 * Math.max(vw / openW, vh / openH));\n  }\n\n  /* Four beats: the lock turns, the leaves part, we walk through, the frame is\n     past us. The walk is its own beat — that is the whole point. */\n  unlock() {\n    if (this.state.phase !== 'locked') return;\n    this._sealed = true;\n    cancelAnimationFrame(this._poll);\n    this.cue('unlock');\n    this.setState({ phase: 'turning' });\n  onSelect: () => this.cue('select'),\n\n      // the lock ratchets a full 135° before anything else is allowed to move\n      /* One hole per attribute. Two adjacent holes in a single style value —\n         style=\"{{ a }}{{ b }}\" — drops the whole attribute rather than\n         concatenating, so RUSH rendered as unstyled 16px body text and ignored\n         every title control. Both words are composed here instead. */\n      titleStyleCss: this.titleCss(),\n      rushStyleCss: this.titleCss(true),\n      lockGap: (this.props.lockGap ?? 9) + '%',\n\n      boltScale: turning ? 0.84 : 1,\n      hubRot: turning ? '135deg' : '0deg',\n      // it no longer fades: it is bolted to the leaf and leaves with it\n      hubScale: p === 'turning' ? 1.03 : 1,\n\n      leafTopT: open ? 'translateY(-108%)' : 'translateY(0)',\n      leafBotT: open ? 'translateY(108%)' : 'translateY(0)',\n      hazOp: p === 'locked' ? 0.5 : p === 'turning' ? 1 : 0,\n      // a 1x effect: anything riding the through-scale gets magnified into a\n      // full-screen wash, so it is off before the frame grows\n      frameLightOp: scaled ? 0 : 1,\n      // space sits over the menu until we are through, then drops behind it\n      skyZ: through ? 0 : 2,\n      // once through, the rear field is the only one needed\n      frontSkyOp: through ? 0 : 1,\n      promptOp: turning ? 0 : 1,\n\n      /* Walking in: the frame grows until its opening is bigger than the screen,\n         so the wall and jamb leave through the edges. Only once they are genuinely\n         outside the viewport does opacity drop — a fade while still on screen is\n         exactly the cross-dissolve this is meant to replace. */\n      doorScale: scaled ? this.throughScale() : 1,\n      doorOp: through ? 0 : 1,\n\n      menuHit: through ? 'auto' : 'none',\n      replayOp: through ? 1 : 0,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
