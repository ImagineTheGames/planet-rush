# Planet Rush CI + classroom distribution (GDD §4.8).
#
#   pull_request      -> typecheck, unit tests, build, mobile   (the merge gate)
#   push to main      -> the same + deploy dist/ to GitHub Pages (the public URL)
#   push of a v* tag  -> the same + ping ntfy with the milestone's play notes
#   workflow_dispatch -> the same, on any ref, for a branch with no PR yet
#
# A relative Vite base ('./', see vite.config.ts) lets the one built bundle
# serve from any Pages subpath, so deploy needs no per-ref rebuild.
name: CI

# --- ONE RUN PER PUSH (a0-83). --------------------------------------------
#
# `branches: ['**']` used to sit next to `pull_request`, and a branch with an
# open PR matches BOTH, so every push to every agent branch fired two identical
# runs. Of the 97 non-main commits in the 200 CI runs before this change, 81
# were built twice.
#
# The wasted minutes were the smaller half. The twins are not synchronised
# (measured 2026-08-18: a0-81's pair started in the same second, a0-77's 37 s
# apart), so a PR stays UNSTABLE until the SLOWER twin finishes and
# merge-on-green ends up waiting on a redundant copy of work that already
# passed. #449 and #450 sat green-but-unmerged for over two hours for exactly
# that reason.
#
# So `push` no longer covers agent branches. `pull_request` is their gate, and
# it is the better of the two: it builds the merge result rather than the
# branch tip, and it is the only event for which the `mobile` job's `if:` is
# true off main. What `push` still covers is unchanged and load-bearing:
#
#   - main, because that is the path to the player — `deploy` and then
#     `Verify live deploy boots`, the gate that exists because a stale service
#     worker once bricked the phone (LESSONS §5);
#   - `v*` tags, because milestone deploys and the ntfy ping ride them. A
#     `push` block carrying both `branches:` and `tags:` fires when EITHER
#     matches, so narrowing the branch list leaves the tag path alone.
#
# The one gap this opens is a branch pushed before its PR exists, which now
# gets no CI until the PR is opened. `workflow_dispatch` covers that on
# demand — `gh workflow run ci.yml --ref <branch>` — which is a cheaper
# answer than duplicating every push all day to buy coverage for the few
# minutes before a PR is opened.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# --- Supersede a PR's own stale runs, and nothing that ships. -------------
#
# Agents push in bursts — a0-75 pushed three commits in four minutes and all
# three ran the whole pipeline to completion, though only the last one's result
# was ever read. Grouping a PR's runs by PR NUMBER lets the run for commit N+1
# cancel the superseded run for commit N, whose checks hang off an SHA that is
# no longer the head, so nothing a merge gate reads goes yellow.
#
# push and dispatch runs key on `github.run_id` instead, which is unique per
# run, so each is alone in its group by construction: a main or tag run can
# never be cancelled by a later one — and never QUEUES behind one either, which
# a shared group with `cancel-in-progress: false` would do, serialising every
# merge to main behind the previous merge's six-shard mobile suite. Deploy
# keeps its own `pages` group below; that is the thing that must not overlap.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Least privilege by default; the deploy job widens this for itself.
permissions:
  contents: read

# --- EVERY JOB IS BOUNDED (a0-84). ----------------------------------------
#
# GitHub's default job timeout is SIX HOURS, and on 2026-08-18 four runs used
# most of it: `Boot from the deploy subpath` and `Mobile emulation shard 6/6`
# sat at step 7/13 for up to 3h40m on `npx playwright install-deps chromium`,
# an apt call against a stalled mirror. Nothing failed, so nothing retried, and
# #451/#452/#454 held finished work at UNSTABLE for one to three hours until a
# human cancelled them by hand. A hung job must FAIL, because a failure retries
# and a hang does not.
#
# HOW THESE NUMBERS WERE PICKED. Measured, not guessed: all 487 ci.yml runs
# between 2026-08-11 and 2026-08-18 (35 932 step records), with the Playwright
# install steps subtracted so a stalled mirror could not inflate the very
# budget meant to catch it. Per job, in minutes:
#
#   job                             n     p50    p99     max    timeout
#   Typecheck, test, build        480     7.6   10.2    14.7      25
#   Boot from the deploy subpath   91     1.1    3.6     7.1      15
#   Perf gate — submission budget 421     1.6    4.5     8.1      15
#   Mobile shard N/6             1484    17.1   26.8    41.8      55
#   Verify live deploy boots       72     0.9    3.6     4.0      15
#   Deploy to GitHub Pages         73     0.1    0.8     1.6      15
#   Mobile emulation (rollup)     245      ~0     ~0      ~0       5
#   Ping ntfy (tagged release)      —       —      —       —       5
#
# THE LONGEST LEGITIMATE JOB IN THAT WEEK WAS 41.8 MINUTES — mobile shard 1/6
# on run 31893809811, and it was RED: a failing shard pays retries and trace
# capture, so the slowest honest run of this pipeline is a failing one, not a
# passing one. The slowest GREEN shard was 29.2 min (shard 6, run 32070397700,
# which also ate a 6m45s `actions/checkout` stall). That is the number to
# compare against when asking "is this job slow or is it hung": under ~42 min a
# mobile shard is working, over it is not, and every other job in this file
# should be done inside 15.
#
# The `max` column is what sets each budget, not `p99` — a timeout that trips on
# a legitimate slow run is a flaky gate, and a flaky gate gets ignored. Headroom
# is roughly 1.3–1.9x over the observed max. What these numbers cannot do is
# absorb a suite that grows: if a mobile shard starts timing out at 55 min, the
# answer is the shard plan (tests/mobile/shard-plan.ts, N in the matrix below),
# not a bigger number here.

jobs:
  # --- The merge gate: runs on every event this workflow answers to. -----
  ci:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    # 14.7 min observed max over 480 runs (the max is a RED run — a failing
    # vitest suite runs longer than a passing one). No apt on this job at all.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      # --- The dark-matter gate (a1-09). ------------------------------------
      #
      # Fails on a NEW export that no production code calls. It is here, after
      # the tests, because it catches the one thing a green test run cannot:
      # `matchAbundance` was three correct lines with a passing spec and full
      # coverage, and no caller, so every match ran a 150 s wave schedule under
      # a lobby chip promising SCARCE. Typecheck, tests and build were all green
      # the entire time. The only symptom was that nobody called it, and that is
      # the symptom this step reads.
      #
      # It is a DELTA gate, not a backlog gate: the 278 candidates triaged in
      # docs/dark-matter-scan.md sit in tools/dark-matter-allowlist.json and do
      # not fail anything, so what goes red is what this push added. Over the 99
      # merges to main in the week before it landed, that would have been 65
      # exports — roughly one every other merge, and a third of them findings
      # worth acting on (docs/dark-matter-scan.md §5 has the count and the
      # working).
      #
      # When it is red: wire the export up, delete it, or — if it is a
      # deliberate seam, an invariant a spec pins, or public surface — add it to
      # the allowlist WITH A REASON and record the verdict in the report. The
      # allowlist entry is the claim; `npm run dark-matter` shows the evidence.
      #
      # The companion check `npm run dark-matter:audit` is deliberately NOT a
      # step here (a1-14). It audits the REASONS in the allowlist against the
      # scan's numbers, has standing hits that are already answered in
      # docs/dark-matter-scan.md §4.0, and would print them on every run. Run it
      # by hand when editing that report or before acting on a DEAD verdict.
      - name: Dark matter (no new uncalled exports)
        run: npm run dark-matter:check

      - name: Build
        run: npx vite build
        env:
          # The shipped client must know the live allocator — without this the
          # online menu fails closed with "can't reach the servers" (bit us 2026-07-29).
          VITE_ALLOCATOR_URL: https://planet-rush-allocator.fly.dev

      # Only main and v* tags ship; feature branches stop at the gate above.
      - name: Package Pages artifact
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # --- The subpath gate: the shipped artifact, at the shipped PATH (a0-66). ---
  #
  # `verify-live` below is the last thing between a broken deploy and the
  # developer's phone, and on 2026-08-16 it caught a real one: the client asked
  # for `https://imaginethegames.github.io/fonts/*.woff2` — no `/planet-rush/` —
  # and got two 404s. It caught it AFTER the deploy, so the price was 14 merges
  # during which the last good build kept serving, and the developer noticed
  # before the studio did, twice.
  #
  # Nothing pre-merge could have seen it, for one structural reason: EVERY other
  # server in this repository serves the game at `/`. vite dev, vite preview, the
  # mobile suite, the rest of live-stage — origin and base are the same string in
  # all of them, so a root-absolute URL written as a TypeScript string literal
  # (which Vite does not rewrite; see src/platform/asset-url.ts) resolves fine
  # everywhere except the one place that matters.
  #
  # This job is that missing server: `vite preview --base /planet-rush/` on the
  # ordinary `base: './'` build — the same bytes Pages receives, at the path Pages
  # serves them from — booted twice, with every same-origin request accounted for
  # and the app-shell worker required to take control. `deploy` needs it, so this
  # class of bug now fails a PR instead of a deploy.
  #
  # Ungated, like the merge gate and the perf gate and unlike the mobile suite:
  # it is ~25 s of test behind the build, and it must not be `if:`-gated to
  # PRs/main, because `deploy` depends on it and a SKIPPED dependency skips the
  # dependent — which would silently stop v* tags shipping.
  subpath-boot:
    name: Boot from the deploy subpath
    runs-on: ubuntu-latest
    # 7.1 min observed max over 91 runs, net of the apt step this job no longer
    # has. It is ~25 s of test behind an `npm ci` and a build; 15 is generous.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # The same VITE_ALLOCATOR_URL the shipped build is given, so the bundle
      # under test is the bundle that deploys and the online menu does not fail
      # closed inside this boot.
      - run: npm run test:subpath
        env:
          VITE_ALLOCATOR_URL: https://planet-rush-allocator.fly.dev

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-subpath
          path: playwright-report/
          retention-days: 7

  # --- Publish the built client to GitHub Pages. ------------------------
  deploy:
    name: Deploy to GitHub Pages
    # 1.6 min observed max over 73 runs; this job is one `deploy-pages` call.
    # 15 leaves that action's own 10-minute internal timeout to fire first, so
    # a stuck Pages API reports itself instead of being guillotined by us.
    timeout-minutes: 15
    # `subpath-boot` joins `ci` here so a base-path regression can never reach
    # the live URL again (a0-66). Both are ungated, so neither can be skipped
    # out from under this job.
    needs: [ci, subpath-boot]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # Serialize deploys without cancelling an in-flight publish.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4

  # --- On a v* tag: ping the classroom with the milestone's play notes. --
  notify:
    name: Ping ntfy (tagged release)
    # A checkout, a jq lookup and one curl. No v* tag was pushed in the measured
    # week, so this is sized from its content rather than from history.
    timeout-minutes: 5
    needs: deploy
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Post milestone notes to ntfy
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${NTFY_TOPIC:-}" ]; then
            echo "NTFY_TOPIC secret is unset — skipping the release ping."
            exit 0
          fi
          # Milestone lookup mirrors the deploy contract: .tags[<tag>] first,
          # else .default (milestones.json header, GDD §4.6a).
          entry=$(jq -c --arg t "$TAG" '.tags[$t] // .default' milestones.json)
          title=$(printf '%s' "$entry" | jq -r '.title')
          notes=$(printf '%s' "$entry" | jq -r '.test_notes')
          body=$(printf '%s\n\nPlay: %s' "${notes}" "${PAGE_URL}")
          curl -fsS \
            -H "Title: ${title} (${TAG})" \
            -H "Tags: rocket" \
            -d "${body}" \
            "https://ntfy.sh/${NTFY_TOPIC}"

  # --- The performance gate's PORTABLE half (a1-16, G-15). -----------------
  #
  # GDD §4.3 ends "Verified by the M5 performance gate, not assumed." Until this
  # job existed the renderer's half of that gate was `PERF_GATE=1` and out of CI
  # by design, so the sentence held only as often as somebody ran it by hand.
  # Four render-path changes landed in one night — a1-11's atlas pooling,
  # a1-12's viewport cull, a2-07's VFX layer, u14-01's typefaces — against a gate
  # documented as automatic that nobody had run.
  #
  # WHAT THIS JOB ASSERTS, AND WHAT IT REFUSES TO. Draw calls per frame and
  # entities submitted per frame on the §4.3 stress scene. Those are
  # architecture: N un-batchable contexts cannot batch on any silicon, and an
  # entity the cull skipped is submitted nowhere — the numbers travel from a
  # GPU-less runner to integrated graphics and to a phone. Milliseconds do not,
  # in either direction, so this job measures none. A green "60 fps" from a box
  # drawing WebGL through SwiftShader on a shared vCPU would be worse than no
  # claim at all, because it reads as verification.
  #
  # THE OTHER HALF IS STILL MANUAL, ON PURPOSE, AND IT IS WRITTEN DOWN:
  #
  #   PERF_GATE=1 npx playwright test --config tests/perf/playwright.perf.config.ts
  #
  # on the developer's own machine and phone. docs/perf-gate.md says what to run,
  # on what hardware, and when it is required (before a milestone tag, at
  # minimum). Nothing in CI substitutes for it.
  #
  # Ungated, like the merge gate above and unlike the mobile suite: it is ~20 s
  # of measurement behind a ~2 min fixed cost, and a renderer regression is
  # cheapest to see on the push that caused it.
  perf-budget:
    name: Perf gate — submission budget (draw calls, entities)
    runs-on: ubuntu-latest
    # 8.1 min observed max over 421 runs net of apt — and this is the job that
    # showed the problem most clearly: its raw max was 34.6 min, of which 32.9
    # was a single `install-deps` that still concluded `success` (run
    # 32077383512). ~2 min of fixed cost + ~75 s of measurement otherwise.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # The thresholds live in tests/perf/budget.ts with their provenance. They
      # are NOT overridden here, and the one knob that exists (PERF_BUDGET_SCALE)
      # is clamped to <= 1 in the spec so a workflow file cannot loosen a budget
      # it happens to be failing.
      - run: npm run test:perf-budget

  # --- The mobile gate, sharded across parallel runners (a0-00, a0-00b). ----
  #
  # The suite is 213 collected tests — of which 123 actually execute, the rest
  # being `test.skip`ped by project — and ~127 minutes of SERIAL test time on a
  # GitHub runner, executed at `workers: 2`. One runner spent ~60 minutes on it
  # and every PR paid that once, twice when a timeout forced a re-run. Nothing
  # about what is asserted changes here: same specs, same three projects, same
  # budgets, same baselines, same `maxDiffPixelRatio`. The work is only spread
  # across N runners.
  #
  # Sharded by TEST, not by project, and that is not a preference — `[iphone]`
  # alone is 55 of the 127 serial minutes (43%), so a project-level split would
  # floor the job at ~34 minutes no matter how many runners it got.
  #
  # ── AND BY MEASURED DURATION, NOT BY TEST COUNT (a0-00b) ─────────────────
  # a0-00 used Playwright's native `--shard=i/N`, which divides by test COUNT.
  # The four shards came back at 5 · 12 · 21 · 42 minutes: a gate is as slow as
  # its slowest shard, so four runners bought the wall time of one 42-minute
  # job. This suite's executed tests span 1.4 s to 300 s and a third of what
  # `--shard` counts is skips, so counting tests measures almost nothing about
  # cost. The split is computed from a measured cost table instead —
  # `tests/mobile/shard-plan.ts`, driven by MOBILE_SHARD / MOBILE_SHARDS below,
  # with `tests/mobile-shard-plan.test.ts` asserting on the cheap unit-test job
  # that the shards' union is exactly the suite and nothing is in two of them.
  #
  # ── N=6 AT ONE WORKER, NOT N=4 AT TWO (a0-00b) ───────────────────────────
  # `playwright.config.ts` pins `workers: 1` in CI — read the comment there for
  # the four measurements behind it. The short version: a second worker on a
  # 4-core software-GL runner does not halve the wall time, it multiplies every
  # CDP round trip by up to 5× and turns budgets into coin flips. N replaces it.
  #
  # N=6 is chosen from the cost table, and the table is now measured at the
  # config it schedules — run 31258319576 was `workers: 2`, this one is the
  # green `workers: 1` run 31259840319. That re-measurement mattered, because
  # the contention tax was NOT uniform: `pixel|upgrade-wheel-gantry` fell 918 →
  # 190 s (4.8×) while `iphone|goldens` fell 1032 → 659 s (1.6×). Ratios moved,
  # so the plan moved with them.
  #
  #   - total serial work is 3838 s, so an even split at N=6 is **640 s**;
  #   - the floor is the heaviest INDIVISIBLE unit — one spec file on one
  #     project, which `fullyParallel: false` runs serially in one worker — and
  #     that is `iphone|goldens.spec.ts` at **659 s**, just over the even split.
  #     N=6 is therefore where the split stops paying: N=7 and N=8 return the
  #     SAME 659 s makespan and only widen the spread (26 s → 136 s → 214 s), so
  #     the 7th and 8th runners buy nothing at all.
  #   - per-job fixed cost (checkout → npm ci → cache restore → install-deps,
  #     then the webServer's `npm run build`) is ~2 min, paid in parallel.
  #
  # Full table, and the N either side: tests/reports/mobile-shard-a0-00.md.
  mobile:
    name: Mobile emulation (Playwright) — shard ${{ matrix.shard }}/${{ strategy.job-total }}
    # The one genuinely long job in this file: 41.8 min observed max over 1484
    # shard-jobs, net of apt. Red shards are the slow ones (retries + traces);
    # the slowest green shard was 29.2 min. 55 is ~1.3x the honest worst case.
    # This is a job budget, not a test budget — Playwright bounds each test in
    # playwright.config.ts, and the shard plan bounds each shard.
    timeout-minutes: 55
    # Run where gating matters: PRs and main. A `workflow_dispatch` on a branch
    # is a smoke check, not a gate, so it stops at the cheap jobs above.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      # Every shard runs to completion. A red shard must not cancel its
      # siblings: the point of the gate is the WHOLE failure list in one pass,
      # and a cancelled sibling is also a check the supervisor cannot read as
      # a real pass (the cancelled-checks hole that made the gate stricter).
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Cache the browser binary, keyed on the pinned Playwright version.
      - id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # On a cache miss: browser + system libs. On a hit: only the system libs
      # (they're apt packages, not in ~/.cache, so they never get cached).
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # `strategy.job-total` is the length of the matrix above, so N is stated
      # in exactly one place — add a shard to the list and the denominator
      # follows. A hardcoded `4` here is how a suite silently stops running a
      # quarter of itself.
      #
      # MOBILE_SHARD / MOBILE_SHARDS rather than `--shard`: the assignment is
      # made by measured duration in playwright.config.ts (see the note above),
      # and every shard computes the same whole plan and takes its own slice, so
      # the runners agree by construction rather than by protocol. Each one logs
      # the plan and the files it picked up before it starts.
      - run: npm run test:mobile
        env:
          MOBILE_SHARD: ${{ matrix.shard }}
          MOBILE_SHARDS: ${{ strategy.job-total }}

      # Per-shard artifact name. Required by upload-artifact@v4 (same-name
      # uploads from parallel jobs are an error), and it is also what keeps
      # q8-01's inspectability: each shard writes its own self-contained
      # `playwright-report/index.html` with the actual/expected/diff PNGs and
      # the trace inlined, so a failure in shard 3 downloads and opens by
      # double-clicking, exactly as it did when there was one job.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  # --- The rollup: N shards, ONE required check. ---------------------------
  #
  # This job deliberately keeps the name the single-job gate used to have —
  # `Mobile emulation (Playwright)` — so the repository's required-check
  # setting keeps resolving without being re-pointed. It is red unless every
  # shard succeeded: `needs.mobile.result` is the matrix's AGGREGATE result,
  # which is `success` only when all matrix jobs succeeded, and `failure` /
  # `cancelled` / `skipped` otherwise. `!cancelled()` makes it run even when a
  # shard failed (a `needs` job that is skipped because its dependency failed
  # would report as SKIPPED, which a merge gate reads as "not red" — the exact
  # hole this closes).
  #
  # The `if` repeats the shards' own gate so that on an ordinary agent-branch
  # push, where the shards are skipped by design, this does not fire and paint
  # the branch red.
  mobile-gate:
    name: Mobile emulation (Playwright)
    needs: mobile
    # Reads one string out of `needs` and echoes it. Seconds, always.
    timeout-minutes: 5
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    steps:
      - name: All shards must be green
        env:
          SHARDS_RESULT: ${{ needs.mobile.result }}
        run: |
          set -euo pipefail
          echo "Aggregate result of the mobile shard matrix: ${SHARDS_RESULT}"
          if [ "${SHARDS_RESULT}" != "success" ]; then
            echo "::error::The mobile suite is red — at least one shard did not pass" \
                 "(aggregate: ${SHARDS_RESULT}). Open the failing shard's job for the" \
                 "inline annotation, and its playwright-report-shard-N artifact for the" \
                 "actual/expected/diff PNGs and the trace."
            exit 1
          fi
          echo "Every mobile shard passed."

  # --- After deploy: prove the LIVE url actually boots (twice — the second
  # --- visit goes through the service worker, the path that once shipped dead).
  verify-live:
    name: Verify live deploy boots
    needs: deploy
    # 4.0 min observed max over 72 runs net of apt; ~25 s of test behind the
    # fixed cost. It fetches a LIVE url, so the tail here is the internet's.
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - env:
          LIVE_URL: ${{ needs.deploy.outputs.page_url }}
        run: npx playwright test --config tests/live/playwright.live.config.ts
