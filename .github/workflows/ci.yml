# Planet Rush CI + classroom distribution (GDD §4.8).
#
#   push (any branch/PR) -> typecheck, unit tests, build     (the merge gate)
#   push to main         -> + deploy dist/ to GitHub Pages    (the public URL)
#   push of a v* tag     -> + ping ntfy with the milestone's play notes
#
# A relative Vite base ('./', see vite.config.ts) lets the one built bundle
# serve from any Pages subpath, so deploy needs no per-ref rebuild.
name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

# Least privilege by default; the deploy job widens this for itself.
permissions:
  contents: read

jobs:
  # --- The merge gate: runs on every push and PR. ------------------------
  ci:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npx vite build
        env:
          # The shipped client must know the live allocator — without this the
          # online menu fails closed with "can't reach the servers" (bit us 2026-07-29).
          VITE_ALLOCATOR_URL: https://planet-rush-allocator.fly.dev

      # Only main and v* tags ship; feature branches stop at the gate above.
      - name: Package Pages artifact
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # --- Publish the built client to GitHub Pages. ------------------------
  deploy:
    name: Deploy to GitHub Pages
    needs: ci
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # Serialize deploys without cancelling an in-flight publish.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4

  # --- On a v* tag: ping the classroom with the milestone's play notes. --
  notify:
    name: Ping ntfy (tagged release)
    needs: deploy
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Post milestone notes to ntfy
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${NTFY_TOPIC:-}" ]; then
            echo "NTFY_TOPIC secret is unset — skipping the release ping."
            exit 0
          fi
          # Milestone lookup mirrors the deploy contract: .tags[<tag>] first,
          # else .default (milestones.json header, GDD §4.6a).
          entry=$(jq -c --arg t "$TAG" '.tags[$t] // .default' milestones.json)
          title=$(printf '%s' "$entry" | jq -r '.title')
          notes=$(printf '%s' "$entry" | jq -r '.test_notes')
          body=$(printf '%s\n\nPlay: %s' "${notes}" "${PAGE_URL}")
          curl -fsS \
            -H "Title: ${title} (${TAG})" \
            -H "Tags: rocket" \
            -d "${body}" \
            "https://ntfy.sh/${NTFY_TOPIC}"

  # --- The mobile gate, sharded across parallel runners (a0-00, a0-00b). ----
  #
  # The suite is 213 collected tests — of which 123 actually execute, the rest
  # being `test.skip`ped by project — and ~127 minutes of SERIAL test time on a
  # GitHub runner, executed at `workers: 2`. One runner spent ~60 minutes on it
  # and every PR paid that once, twice when a timeout forced a re-run. Nothing
  # about what is asserted changes here: same specs, same three projects, same
  # budgets, same baselines, same `maxDiffPixelRatio`. The work is only spread
  # across N runners.
  #
  # Sharded by TEST, not by project, and that is not a preference — `[iphone]`
  # alone is 55 of the 127 serial minutes (43%), so a project-level split would
  # floor the job at ~34 minutes no matter how many runners it got.
  #
  # ── AND BY MEASURED DURATION, NOT BY TEST COUNT (a0-00b) ─────────────────
  # a0-00 used Playwright's native `--shard=i/N`, which divides by test COUNT.
  # The four shards came back at 5 · 12 · 21 · 42 minutes: a gate is as slow as
  # its slowest shard, so four runners bought the wall time of one 42-minute
  # job. This suite's executed tests span 1.4 s to 300 s and a third of what
  # `--shard` counts is skips, so counting tests measures almost nothing about
  # cost. The split is computed from a measured cost table instead —
  # `tests/mobile/shard-plan.ts`, driven by MOBILE_SHARD / MOBILE_SHARDS below,
  # with `tests/mobile-shard-plan.test.ts` asserting on the cheap unit-test job
  # that the shards' union is exactly the suite and nothing is in two of them.
  #
  # ── N=8 AT ONE WORKER, NOT N=4 AT TWO (a0-00b) ───────────────────────────
  # `playwright.config.ts` pins `workers: 1` in CI — read the comment there for
  # the four measurements behind it. The short version: a second worker on a
  # 4-core software-GL runner does not halve the wall time, it multiplies every
  # CDP round trip by up to 5× and turns budgets into coin flips. N replaces it.
  #
  # N=8 is chosen from the refreshed cost table, not from taste:
  #
  #   - total serial work is 8355 s, so an even split at N=8 is **1044 s**;
  #   - the floor is the heaviest INDIVISIBLE unit — one spec file on one
  #     project, which `fullyParallel: false` runs serially in one worker — and
  #     that is now `iphone|goldens.spec.ts` at **1032 s**, just under the even
  #     split. N=8 is therefore the LARGEST N that still divides evenly; at N=9
  #     the brick binds and the extra runner buys nothing.
  #   - per-job fixed cost (checkout → npm ci → cache restore → install-deps,
  #     then the webServer's `npm run build`) is ~2 min, paid in parallel.
  #
  # Those 8355 s are themselves measured at `workers: 2`, so they carry the
  # contention tax this change removes — meaning ~17 min/shard is the WORST
  # case, the one where relieving contention buys nothing at all. Full table,
  # and the N either side: tests/reports/mobile-shard-a0-00.md.
  mobile:
    name: Mobile emulation (Playwright) — shard ${{ matrix.shard }}/${{ strategy.job-total }}
    # Run where gating matters (PRs + main) — not on every agent branch push.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      # Every shard runs to completion. A red shard must not cancel its
      # siblings: the point of the gate is the WHOLE failure list in one pass,
      # and a cancelled sibling is also a check the supervisor cannot read as
      # a real pass (the cancelled-checks hole that made the gate stricter).
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Cache the browser binary, keyed on the pinned Playwright version.
      - id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # On a cache miss: browser + system libs. On a hit: only the system libs
      # (they're apt packages, not in ~/.cache, so they never get cached).
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # `strategy.job-total` is the length of the matrix above, so N is stated
      # in exactly one place — add a shard to the list and the denominator
      # follows. A hardcoded `4` here is how a suite silently stops running a
      # quarter of itself.
      #
      # MOBILE_SHARD / MOBILE_SHARDS rather than `--shard`: the assignment is
      # made by measured duration in playwright.config.ts (see the note above),
      # and every shard computes the same whole plan and takes its own slice, so
      # the runners agree by construction rather than by protocol. Each one logs
      # the plan and the files it picked up before it starts.
      - run: npm run test:mobile
        env:
          MOBILE_SHARD: ${{ matrix.shard }}
          MOBILE_SHARDS: ${{ strategy.job-total }}

      # Per-shard artifact name. Required by upload-artifact@v4 (same-name
      # uploads from parallel jobs are an error), and it is also what keeps
      # q8-01's inspectability: each shard writes its own self-contained
      # `playwright-report/index.html` with the actual/expected/diff PNGs and
      # the trace inlined, so a failure in shard 3 downloads and opens by
      # double-clicking, exactly as it did when there was one job.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  # --- The rollup: N shards, ONE required check. ---------------------------
  #
  # This job deliberately keeps the name the single-job gate used to have —
  # `Mobile emulation (Playwright)` — so the repository's required-check
  # setting keeps resolving without being re-pointed. It is red unless every
  # shard succeeded: `needs.mobile.result` is the matrix's AGGREGATE result,
  # which is `success` only when all matrix jobs succeeded, and `failure` /
  # `cancelled` / `skipped` otherwise. `!cancelled()` makes it run even when a
  # shard failed (a `needs` job that is skipped because its dependency failed
  # would report as SKIPPED, which a merge gate reads as "not red" — the exact
  # hole this closes).
  #
  # The `if` repeats the shards' own gate so that on an ordinary agent-branch
  # push, where the shards are skipped by design, this does not fire and paint
  # the branch red.
  mobile-gate:
    name: Mobile emulation (Playwright)
    needs: mobile
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    steps:
      - name: All shards must be green
        env:
          SHARDS_RESULT: ${{ needs.mobile.result }}
        run: |
          set -euo pipefail
          echo "Aggregate result of the mobile shard matrix: ${SHARDS_RESULT}"
          if [ "${SHARDS_RESULT}" != "success" ]; then
            echo "::error::The mobile suite is red — at least one shard did not pass" \
                 "(aggregate: ${SHARDS_RESULT}). Open the failing shard's job for the" \
                 "inline annotation, and its playwright-report-shard-N artifact for the" \
                 "actual/expected/diff PNGs and the trace."
            exit 1
          fi
          echo "Every mobile shard passed."

  # --- After deploy: prove the LIVE url actually boots (twice — the second
  # --- visit goes through the service worker, the path that once shipped dead).
  verify-live:
    name: Verify live deploy boots
    needs: deploy
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - env:
          LIVE_URL: ${{ needs.deploy.outputs.page_url }}
        run: npx playwright test --config tests/live/playwright.live.config.ts
