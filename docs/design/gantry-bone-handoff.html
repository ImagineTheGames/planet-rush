document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ive=\"transform:translateY(2px);filter:brightness(.96);\">\n            <div style=\"background:linear-gradient(180deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,0) 44%),linear-gradient(100deg,var(--acc-fill,#454e5a),#1c222a 62%);clip-path:polygon(0 0,calc(100% - 19px) 0,100% 19px,100% 100%,19px 100%,0 calc(100% - 19px));height:60px;display:flex;align-items:center;justify-content:center;\">\n              <span style=\"font-family:Audiowide;font-size:22px;letter-spacing:.1em;color:var(--acc-hi,#FFFFFF);text-shadow:0 2px 0 rgba(0,0,0,.45);\">DONE<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ showSoundSpec }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"max-width:1280px;display:flex;flex-direction:column;gap:22px;border-top:1px solid #1c222a;padding-top:44px;\">\n    <div style=\"display:flex;flex-direction:column;gap:8px;\">\n      <div style=\"font-family:Audiowide;font-size:13px;letter-spacing:.26em;color:var(--acc,#8B95A5);\">UNCHANGED FROM ROUND 1<\u002Fdiv>\n      <div style=\"font-family:Audiowide;font-size:28px;color:#DCE3EC;\">Sound &amp; motion cue spec<\u002Fdiv>\n      <p style=\"margin:4px 0 0;font-size:16px;line-height:1.6;color:#8B95A5;max-width:900px;text-wrap:pretty;\">Every press is detuned by up to half a semitone (±0.5st, one factor per cue so intervals stay exact) — that slight variation is what stops a fast run of clicks sounding like a sample retriggering. Two rules carry the immersion: <strong style=\"color:#C6CDD6;\">every UI state change makes exactly one sound<\u002Fstrong>, and <strong style=\"color:#C6CDD6;\">the sound tells you the outcome before the pixels do<\u002Fstrong>. Struck glass throughout: one pane of glass struck different ways. Hover is a single high partial stack; the click is that same stack an octave down, struck twice rising; back is the same two notes falling. Longer moments (a purchase settling, a seat joining, the launch) add the lower partials (4.2 / 7.1) and a real tail, all through one shared room — one pane, struck differently. No square or saw anywhere. All cues under 180ms except where noted.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:1px;background:#1c222a;border:1px solid #1c222a;\">\n      <div style=\"display:grid;grid-template-columns:230px 1fr 300px;gap:1px;background:#1c222a;\">\n        <div style=\"background:#0f1319;padding:12px 18px;font-family:Oxanium;font-weight:800;font-size:12px;letter-spacing:.26em;color:var(--acc,#8B95A5);\">INTERACTION<\u002Fdiv>\n        <div style=\"background:#0f1319;padding:12px 18px;font-family:Oxanium;font-weight:800;font-size:12px;letter-spacing:.26em;color:var(--acc,#8B95A5);\">SOUND<\u002Fdiv>\n        <div style=\"background:#0f1319;padding:12px 18px;font-family:Oxanium;font-weight:800;font-size:12px;letter-spacing:.26em;color:var(--acc,#8B95A5);\">MOTION<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:230px 1fr 300px;gap:1px;background:#1c222a;\">\n        <div style=\"background:#0b0e12;padding:14px 18px;font-family:Oxanium;font-weight:700;font-size:14px;color:#C6CDD6;\">Menu hover<\u002Fdiv>\n        <div style=\"background:#0b0e12;padding:14px 18px;font-size:14px;color:#8B95A5;\">A fingertip on glass: 3.5kHz struck, thin tail, barely audible. Pitch fixed — the only cue that never varies, because a wobbling hover feels like a fault.<\u002Fdiv>\n        <div style=\"background:#0b0e12;padding:14px 18px;font-size:14px;color:#7E8894;\">Accent bar grows 0→100% width, 90ms ease-out; plate sheen brightens 6%.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:230px 1fr 300px;gap:1px;background:#1c222a;\">\n        <div style=\"background:#0b0e12;padding:14px 18px;font-family:Oxanium;font-weight:700;font-size:14px;color:#C6CDD6;\">Primary confirm<\u002Fdiv>\n        <div style=\"background:#0b0e12;padding:14px 18px;font-size:14px;color:#8B95A5;\">The hover’s material with an affirmation’s shape: the same three-partial glass an octave down, struck twice — A♭6, then a fifth above it 45ms later. Two consonant notes rising is what the ear hears as \"yes\". No noise transient — that was the hard edge.<\u002Fdiv>\n        <div style=\"background:#0b0e12;padding:14px 18px;font-size:14px;color:#7E8894;\">Plate depresses 2px, 60ms; screen wipes on a 220ms horizontal band.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:230px 1fr 300px;gap:1px;background:#1c222a;\">\n        <div style=\"background:#0b0e12;padding:14px 18px;font-family:Oxanium;font-weight:700;font-size:14px;color:#C6CDD6;\">Back / cancel<\u002Fdiv>\n        <div style=\"background:#0b0e12;padding:14px 18px;font-size:14px;color:#8B95A5;\">The same glass, mirrored: two notes stepping <em>down<\u002Fem> a fourth (A♭6 → E♭6), struck separately — never a glide, which is what read as cartoon. Reserved for BACK and CANCEL <em>only<\u002Fem>; a forward action must never use it. Players learn the interval as \"backwards\" in about three presses.<\u002Fdiv>\n        <div style=\"background:#0b0e12;padding:14px 18px;font-size:14px;color:#7E8894;\">Reverse of whatever the forward transition was. Always.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:230px 1fr 300px;gap:1px;background:#1c222a;\">\n        <div style=\"background:#0b0e12;padding:14px 18px;font-family:Oxanium;font-weight:700;font-size:14px;color:#C6CDD6;\">Forward pick<\u002Fdiv>\n        <div style=\"background:#0b0e12;padding:14px 18px;font-size:14px;color:#8B95A5;\">The hover itself, an octave down and slightly longer — one note with no answering note. For JOIN BY CODE, SETTINGS, a ship row, CHANGE ARENA: forward but non-committal, so it resolves neither up nor down.<\u002Fdiv>\n        <div style=\"background:#0b0e12;padding:14px 18px;font-size:14px;color:#7E8894;\">Plate brightens 30%, presses 2px.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:230px 1fr 300px;gap:1px;background:#1c222a;\">\n        <div style=\"background:#0b0e12;padding:14px 18px;font-family:Oxanium;font-weight:700;font-size:14px;color:#C6CDD6;\">Build wheel opens<\u002Fdiv>\n        <div style=\"background:#0b0e12;padding:14px 18px;font-size:14px;color:#8B95A5;\">Pressurised hiss + hub charge-up, ~200ms. Ambient bed ducks −4dB while open — the wheel takes over the room.<\u002Fdiv>\n        <div style=\"background:#0b0e12;padding:14px 18px;font-size:14px;color:#7E8894;\">Ring scales 0.9→1.0 and fades in over 120ms; labels stagger 20ms apart, clockwise from twelve.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:230px 1fr 300px;gap:1px;background:#1c222a;\">\n        <div style=\"background:#0b0e12;padding:14px 18px;font-family:Oxanium;font-weight:700;font-size:14px;color:#C6CDD6;\">Wedge crossed<\u002Fdiv>\n        <div style=\"background:#0b0e12;padding:14px 18px;font-size:14px;color:#8B95A5;\">The hover an octave up from the click — one note, 120ms, the lightest thing in the set because it fires constantly. Fixed pitch like the hover. On the boundary crossing, not per frame; muted while the wedge is unaffordable.<\u002Fdiv>\n        <div style=\"background:#0b0e12;padding:14px 18px;font-size:14px;color:#7E8894;\">Wedge fill lifts to the plasma tint in 60ms; label goes full-contrast chalk.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:230px 1fr 300px;gap:1px;background:#1c222a;\">\n        <div style=\"background:#0b0e12;padding:14px 18px;font-family:Oxanium;font-weight:700;font-size:14px;color:#C6CDD6;\">Purchase lands<\u002Fdiv>\n        <div style=\"background:#0b0e12;padding:14px 18px;font-size:14px;color:#8B95A5;\">The confirm’s rising pair extended to three notes — A♭6, the fifth, the octave, 60ms apart. Same material and direction as a confirm, just more of it: a purchase is a confirm with consequences.<\u002Fdiv>\n        <div style=\"background:#0b0e12;padding:14px 18px;font-size:14px;color:#7E8894;\">Ore counter ticks down digit by digit; the cost chip flashes and the built counter increments.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:230px 1fr 300px;gap:1px;background:#1c222a;\">\n        <div style=\"background:#0b0e12;padding:14px 18px;font-family:Oxanium;font-weight:700;font-size:14px;color:#C6CDD6;\">Refused (broke / capped)<\u002Fdiv>\n        <div style=\"background:#0b0e12;padding:14px 18px;font-size:14px;color:#8B95A5;\">The same two-note shape as everything else, but the interval is a minor second and it goes nowhere — the pair beats against itself instead of resolving. Family-recognisable, unmistakably not a yes.<\u002Fdiv>\n        <div style=\"background:#0b0e12;padding:14px 18px;font-size:14px;color:#7E8894;\">4px horizontal shake, 100ms. The cost already reads red, so nothing else needs to change.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:230px 1fr 300px;gap:1px;background:#1c222a;\">\n        <div style=\"background:#0b0e12;padding:14px 18px;font-family:Oxanium;font-weight:700;font-size:14px;color:#C6CDD6;\">Seat joins lobby<\u002Fdiv>\n        <div style=\"background:#0b0e12;padding:14px 18px;font-size:14px;color:#8B95A5;\">The family’s single-note form, from A♭6 up by slot index — so eight joins are a rising figure, not eight identical noises.<\u002Fdiv>\n        <div style=\"background:#0b0e12;padding:14px 18px;font-size:14px;color:#7E8894;\">Row slides in 14px from the left, 140ms; identity chip pops last.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:230px 1fr 300px;gap:1px;background:#1c222a;\">\n        <div style=\"background:#0b0e12;padding:14px 18px;font-family:Oxanium;font-weight:700;font-size:14px;color:#C6CDD6;\">RUSH! countdown<\u002Fdiv>\n        <div style=\"background:#0b0e12;padding:14px 18px;font-size:14px;color:#8B95A5;\">Five single notes climbing from A♭6, then the confirm’s three notes struck at once and held. Nothing new is introduced — it is the whole family arriving together, which is why it lands.<\u002Fdiv>\n        <div style=\"background:#0b0e12;padding:14px 18px;font-size:14px;color:#7E8894;\">Number scales 1.3→1.0 per beat; the whole lobby desaturates over the five seconds.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:230px 1fr 300px;gap:1px;background:#1c222a;\">\n        <div style=\"background:#0b0e12;padding:14px 18px;font-family:Oxanium;font-weight:700;font-size:14px;color:#B23A3A;\">Core under attack<\u002Fdiv>\n        <div style=\"background:#0b0e12;padding:14px 18px;font-size:14px;color:#8B95A5;\">Alarm loop, period tied to core HP — slow at 50%, fast at 25%, matching the existing edge-pulse tell.<\u002Fdiv>\n        <div style=\"background:#0b0e12;padding:14px 18px;font-size:14px;color:#7E8894;\">Threat-red vignette pulses on the same clock. Alarm and visual share one timer — never two.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:230px 1fr 300px;gap:1px;background:#1c222a;\">\n        <div style=\"background:#0b0e12;padding:14px 18px;font-family:Oxanium;font-weight:700;font-size:14px;color:#DCE3EC;\">Planet death<\u002Fdiv>\n        <div style=\"background:#0b0e12;padding:14px 18px;font-size:14px;color:#8B95A5;\">Everything cuts. Three seconds of near-silence with only a low room tone, then the bed fades back. Protect it in the mixer, not in gameplay code.<\u002Fdiv>\n        <div style=\"background:#0b0e12;padding:14px 18px;font-size:14px;color:#7E8894;\">HUD drops to 40% opacity for the full three seconds. No popups, no toasts, nothing competes.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fsection>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900},&quot;accentPalette&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;options&quot;:[[&quot;#EEF2F7&quot;,&quot;#a3b2c4&quot;,&quot;#64748b&quot;,&quot;#2f3946&quot;],[&quot;#FFFFFF&quot;,&quot;#b6bfca&quot;,&quot;#8b95a2&quot;,&quot;#454e5a&quot;],[&quot;#EAF6FF&quot;,&quot;#6fb6d8&quot;,&quot;#2b7fa8&quot;,&quot;#215068&quot;],[&quot;#EAF0FF&quot;,&quot;#8fa6e6&quot;,&quot;#3D7BFF&quot;,&quot;#1e3566&quot;],[&quot;#F6ECFF&quot;,&quot;#b492e8&quot;,&quot;#9B5DE5&quot;,&quot;#3d2c5c&quot;],[&quot;#F0FEFF&quot;,&quot;#9fd8de&quot;,&quot;#4f9aa3&quot;,&quot;#1f3d42&quot;],[&quot;#FFE9D6&quot;,&quot;#e0a878&quot;,&quot;#b9762f&quot;,&quot;#4a2f18&quot;],[&quot;#FFEAF3&quot;,&quot;#e79bc0&quot;,&quot;#c2537f&quot;,&quot;#4a2033&quot;]],&quot;default&quot;:[&quot;#EEF2F7&quot;,&quot;#a3b2c4&quot;,&quot;#64748b&quot;,&quot;#2f3946&quot;],&quot;tsType&quot;:&quot;string[]&quot;,&quot;section&quot;:&quot;Direction&quot;,&quot;label&quot;:&quot;Accent colour&quot;},&quot;titleBackdrop&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;void&quot;,&quot;aurora&quot;,&quot;galaxy&quot;,&quot;nebula&quot;,&quot;solar system&quot;],&quot;default&quot;:&quot;void&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Title screen&quot;,&quot;label&quot;:&quot;Backdrop&quot;},&quot;showSoundSpec&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Direction&quot;,&quot;label&quot;:&quot;Show the sound &amp; motion spec&quot;}}\">class Component extends DCLogic {\n  state = { sel: 0, ore: 4, built: [2, 0, 0, 0], soundOn: true, refused: 0 };\n\n  ITEMS = [\n    { name: 'TURRET', sub: 'YOUR PLANET', cost: 3, cap: 4, desc: \"Automated point defence. Fires on anything that isn't yours.\" },\n    { name: 'SHIELD', sub: 'YOUR PLANET', cost: 5, cap: 2, desc: 'Absorbs incoming fire until it breaks. Rebuilds between waves.' },\n    { name: 'REPAIR CORE', sub: 'YOUR PLANET', cost: 1, cap: 4, desc: 'Restores 15 HP to the planet core, instantly.' },\n    { name: 'UPGRADE SHIP', sub: 'YOUR SHIP', cost: 0, cap: 0, desc: 'Opens rig systems — speed, armour, hold, torch.' },\n  ];\n\n  /* ── synthesised cue engine: no audio files, one AudioContext ── */\n  ac() {\n    if (!this._ac) {\n      const C = window.AudioContext || window.webkitAudioContext;\n      if (!C) return null;\n      this._ac = new C();\n      this._master = this._ac.createGain();\n      this._master.gain.value = 0.5;\n      this._master.connect(this._ac.destination);\n    }\n    if (this._ac.state === 'suspended') this._ac.resume();\n    return this._ac;\n  }\n\n  noiseBuf() {\n    const ac = this.ac();\n    if (!this._nb) {\n      const n = ac.sampleRate * 0.5;\n      this._nb = ac.createBuffer(1, n, ac.sampleRate);\n      const d = this._nb.getChannelData(0);\n      for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;\n    }\n    return this._nb;\n  }\n\n  /* Shared room: a short procedural IR on a wet bus. One space for every cue is\n     what makes a UI sound like one instrument instead of a pile of samples. */\n  verb() {\n    const ac = this.ac();\n    if (!ac) return null;\n    if (!this._wet) {\n      const len = Math.floor(ac.sampleRate * 2.2);\n      const ir = ac.createBuffer(2, len, ac.sampleRate);\n      for (let c = 0; c < 2; c++) {\n        const d = ir.getChannelData(c);\n        for (let i = 0; i < len; i++) {\n          const x = i / len;\n          d[i] = (Math.random() * 2 - 1) * Math.pow(1 - x, 2.1) * (1 - Math.exp(-i / 220));\n        }\n      }\n      const cv = ac.createConvolver();\n      cv.buffer = ir;\n      const hp = ac.createBiquadFilter();\n      hp.type = 'highpass';\n      hp.frequency.value = 620;\n      this._wet = ac.createGain();\n      this._wet.gain.value = 0.25;\n      this._wet.connect(hp).connect(cv).connect(this._master);\n    }\n    return this._wet;\n  }\n\n  /* Glassy partial stack: sine only, tiny attack, exponential tail. No square or\n     saw anywhere — those harmonics are what read as retro. */\n  ping({ at = 0, f = 880, dur = 0.24, gain = 0.14, parts = [1, 2.76, 5.4], wet = 0.3, glide = 0, strike = 0.002 } = {}) {\n    const ac = this.ac();\n    if (!ac) return;\n    const t = ac.currentTime + at;\n    const out = ac.createGain();\n    out.gain.value = 1;\n    out.connect(this._master);\n    const w = this.verb();\n    if (w && wet > 0) {\n      const wg = ac.createGain();\n      wg.gain.value = wet;\n      out.connect(wg).connect(w);\n    }\n    parts.forEach((mult, i) => {\n      const o = ac.createOscillator();\n      o.type = 'sine';\n      const f0 = f * mult;\n      o.frequency.setValueAtTime(f0, t);\n      if (glide) o.frequency.exponentialRampToValueAtTime(f0 * glide, t + dur);\n      const g = ac.createGain();\n      // steeper rolloff + faster upper-partial decay = glass, not bell metal\n      const amp = gain / Math.pow(i + 1, 1.45);\n      g.gain.setValueAtTime(0.0001, t);\n      g.gain.linearRampToValueAtTime(amp, t + strike);\n      g.gain.exponentialRampToValueAtTime(0.0001, t + dur * Math.pow(0.66, i));\n      o.connect(g).connect(out);\n      o.start(t);\n      o.stop(t + dur + 0.05);\n    });\n  }\n\n  /* Breath of air, not grit: high-passed noise, always quiet, always short. */\n  air({ at = 0, dur = 0.08, freq = 5200, q = 0.7, gain = 0.05, wet = 0.25 } = {}) {\n    const ac = this.ac();\n    if (!ac) return;\n    const t = ac.currentTime + at;\n    const src = ac.createBufferSource();\n    src.buffer = this.noiseBuf();\n    const f = ac.createBiquadFilter();\n    f.type = 'highpass';\n    f.frequency.value = freq;\n    f.Q.value = q;\n    const g = ac.createGain();\n    g.gain.setValueAtTime(0.0001, t);\n    g.gain.linearRampToValueAtTime(gain, t + 0.01);\n    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);\n    src.connect(f).connect(g).connect(this._master);\n    const w = this.verb();\n    if (w && wet > 0) {\n      const wg = ac.createGain();\n      wg.gain.value = wet;\n      g.connect(wg).connect(w);\n    }\n    src.start(t);\n    src.stop(t + dur + 0.05);\n  }\n\n  /* Clean low body for weight — a filtered sine, never a saw. */\n  sub({ at = 0, f0 = 90, f1 = 56, dur = 0.2, gain = 0.22 } = {}) {\n    const ac = this.ac();\n    if (!ac) return;\n    const t = ac.currentTime + at;\n    const o = ac.createOscillator();\n    o.type = 'sine';\n    o.frequency.setValueAtTime(f0, t);\n    o.frequency.exponentialRampToValueAtTime(f1, t + dur);\n    const lp = ac.createBiquadFilter();\n    lp.type = 'lowpass';\n    lp.frequency.value = 320;\n    const g = ac.createGain();\n    g.gain.setValueAtTime(0.0001, t);\n    g.gain.linearRampToValueAtTime(gain, t + 0.01);\n    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);\n    o.connect(lp).connect(g).connect(this._master);\n    o.start(t);\n    o.stop(t + dur + 0.05);\n  }\n\n  cue(kind, n = 0) {\n    if (!this.state.soundOn || !this.ac()) return;\n    /* Per-fire detune, ±0.5 semitone. Every press varies a little so a fast\n       sequence of clicks reads as a person operating a machine rather than a\n       sample retriggering. Hover and detent are deliberately excluded — they\n       fire constantly, and a wobbling hover feels like a fault. */\n    const vary = () => 0.971 + Math.random() * 0.058;\n    const v = kind === 'hover' || kind === 'detent' ? 1 : vary();\n    switch (kind) {\n      /* Glass = inharmonic upper partials, struck attack, long thin tail.\n         Everything below sits an octave or so higher than the metal version and\n         leans on 4.2/5.4/7.1 ratios, which is what a struck pane actually does. */\n      case 'hover': // fingertip on glass\n        this.ping({ f: 3520, dur: 0.16, gain: 0.04, parts: [1, 2.76, 5.4], wet: 0.34, strike: 0.002 });\n        this.air({ dur: 0.02, freq: 9000, gain: 0.014, wet: 0.2 });\n        break;\n      case 'confirm': /* The hover's material, an affirmation's shape: the same\n         three-partial glass, dropped an octave, struck twice — A♭6 then a fifth\n         above it 45ms later. Two consonant notes rising is what the ear reads as\n         \"yes\". No noise transient anywhere; that was the hard edge. */\n        this.ping({ f: 1661 * v, dur: 0.3, gain: 0.075, parts: [1, 2.76, 5.4], wet: 0.36, strike: 0.002 });\n        this.ping({ at: 0.045, f: 2489 * v, dur: 0.22, gain: 0.05, parts: [1, 2.76], wet: 0.34, strike: 0.002 });\n        this.air({ dur: 0.016, freq: 9000, gain: 0.012, wet: 0.2 });\n        this.sub({ f0: 104, f1: 78, dur: 0.07, gain: 0.055 });\n        break;\n      case 'select': // the hover itself, an octave down and a touch longer — one note, no answer\n        this.ping({ f: 1661 * v, dur: 0.19, gain: 0.05, parts: [1, 2.76, 5.4], wet: 0.3, strike: 0.002 });\n        this.air({ dur: 0.014, freq: 9000, gain: 0.01, wet: 0.18 });\n        break;\n      case 'back': /* Same glass, mirrored: two notes stepping DOWN a fourth,\n         struck separately (never a glide — that was the toony part). Reserved for\n         BACK and CANCEL only; a forward action must never use it. */\n        this.ping({ f: 1661 * v, dur: 0.2, gain: 0.055, parts: [1, 2.76], wet: 0.3, strike: 0.002 });\n        this.ping({ at: 0.05, f: 1245 * v, dur: 0.26, gain: 0.06, parts: [1, 2.76, 5.4], wet: 0.32, strike: 0.002 });\n        this.sub({ f0: 92, f1: 62, dur: 0.08, gain: 0.06 });\n        break;\n      case 'detent': /* Wheel selection: the hover an octave up from the click, one\n         note, very short — it fires constantly, so it has to be the lightest\n         thing in the set while still obviously the same pane. */\n        this.ping({ f: 3322, dur: 0.12, gain: 0.038, parts: [1, 2.76], wet: 0.28, strike: 0.002 });\n        break;\n      case 'buy': /* The confirm's rising pair, extended to three notes — A♭6, the\n         fifth, the octave. Same material, same direction, more of it: a purchase\n         is a confirm with consequences. */\n        this.ping({ f: 1661 * v, dur: 0.26, gain: 0.07, parts: [1, 2.76, 5.4], wet: 0.36, strike: 0.002 });\n        this.ping({ at: 0.06, f: 2489 * v, dur: 0.24, gain: 0.055, parts: [1, 2.76], wet: 0.36, strike: 0.002 });\n        this.ping({ at: 0.13, f: 3322 * v, dur: 0.34, gain: 0.045, parts: [1, 2.76, 5.4], wet: 0.4, strike: 0.002 });\n        this.air({ dur: 0.016, freq: 9000, gain: 0.012, wet: 0.2 });\n        this.sub({ f0: 104, f1: 74, dur: 0.09, gain: 0.07 });\n        break;\n      case 'refuse': /* Same two-note shape as the others, but the interval is a\n         minor second and it goes nowhere — the pair beats against itself instead\n         of resolving. Recognisable as the family; unmistakably not a yes. */\n        this.ping({ f: 1661 * v, dur: 0.26, gain: 0.055, parts: [1, 2.76], wet: 0.26, strike: 0.002 });\n        this.ping({ at: 0.05, f: 1760 * v, dur: 0.32, gain: 0.055, parts: [1, 2.76], wet: 0.26, strike: 0.002 });\n        this.sub({ f0: 84, f1: 80, dur: 0.14, gain: 0.075 });\n        break;\n      case 'join': // one note per seat, stepping up the roster — the family's single-note form\n        this.air({ dur: 0.1, freq: 6000, gain: 0.02, wet: 0.3 });\n        this.ping({ at: 0.04, f: 166 * v1 * Math.pow(2, n / 12), dur: 0.26, gain: 0.055, parts: [1, 2.76, 5.4], wet: 0.4, strike: 0.002 });\n        break;\n      case 'rush': /* Five single notes climbing, then the confirm's three notes\n         struck at once and held. Nothing new is introduced — it is the whole\n         family arriving together, which is why it lands. */\n        for (let i = 0; i < 5; i++) {\n          this.ping({ at: i * 0.42, f: 166 * v1 * Math.pow(2, i / 12), dur: 0.28, gain: 0.062, parts: [1, 2.76, 5.4], wet: 0.42, strike: 0.002 });\n        }\n        this.ping({ at: 2.1, f: 1661 * v, dur: 1.3, gain: 0.075, parts: [1, 2.76, 5.4], wet: 0.6, strike: 0.003 });\n        this.ping({ at: 2.1, f: 2489 * v, dur: 1.1, gain: 0.055, parts: [1, 2.76], wet: 0.6, strike: 0.003 });\n        this.ping({ at: 2.1, f: 3322 * v, dur: 0.9, gain: 0.04, parts: [1, 2.76], wet: 0.6, strike: 0.003 });\n        this.air({ at: 2.1, dur: 0.5, freq: 8000, gain: 0.018, wet: 0.5 });\n        this.sub({ at: 2.1, f0: 104, f1: 78, dur: 0.4, gain: 0.11 });\n        break;\n    }\n  }\n\n  renderVals() {\n    const p = this.props.accentPalette ?? ['#FFFFFF', '#b6bfca', '#8b95a2', '#454e5a'];\n    const pal = Array.isArray(p) ? p : [p, p, p, p];\n    const rgba = (hex, a) => {\n      const h = String(hex || '#FFFFFF').replace('#', '');\n      const n = parseInt(h.length === 3 ? h.split('').map((c) => c + c).join('') : h, 16);\n      return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;\n    };\n    const bg = this.props.titleBackdrop ?? 'void';\n    const { sel, ore, built } = this.state;\n    const items = this.ITEMS;\n    const cur = items[sel];\n    const affordable = (i) => items[i].cost <= ore;\n    const capped = (i) => items[i].cap > 0 && built[i] >= items[i].cap;\n\n    const wedge = (i) => ({\n      ['n' + i]: sel === i ? (pal[0] ?? '#FFFFFF') : '#C6CDD6',\n      ['g' + i]: sel === i ? '0 0 18px ' + rgba(pal[0], 0.5) : 'none',\n      ['f' + i]: sel === i ? 19 : 17,\n      ['sub' + i]: sel === i ? '#DCE3EC' : '#7E8894',\n      ['subT' + i]: items[i].sub,\n      ['c' + i]: capped(i) ? '#6E7987' : affordable(i) ? '#F2D24B' : '#B23A3A',\n      ['cost' + i]: capped(i) ? 'FULL' : items[i].cost + '/' + ore,\n      ['b' + i]: items[i].cap ? built[i] + ' / ' + items[i].cap + ' BUILT' : '',\n    });\n\n    const pick = (i) => () => {\n      if (this.state.sel === i) return;\n      this.setState({ sel: i });\n      if (affordable(i) && !capped(i)) this.cue('detent');\n    };\n\n    return {\n      onHover: () => this.cue('hover'),\n      onPlay: () => this.cue('confirm'),\n      onSecondary: () => this.cue('back'),\n      onSelect: () => this.cue('select'),\n      onRush: () => this.cue('rush'),\n      onSlot: () => this.cue('join', 2),\n      onStep: () => this.cue('detent'),\n      onWedge0: pick(0),\n      onWedge1: pick(1),\n      onWedge2: pick(2),\n      onWedge3: pick(3),\n      onBuy: () => {\n        const i = this.state.sel;\n        if (i === 3) return this.cue('confirm');\n        if (!affordable(i) || capped(i)) return this.cue('refuse');\n        const nb = this.state.built.slice();\n        nb[i] += 1;\n        this.setState({ ore: this.state.ore - items[i].cost, built: nb });\n        this.cue('buy');\n      },\n      soundLabel: this.state.soundOn ? 'SOUND ON' : 'SOUND OFF',\n      onToggleSound: () => {\n        const on = !this.state.soundOn;\n        this.setState({ soundOn: on }, () => { if (on) this.cue('confirm'); });\n      },\n      onJoinDemo: () => { for (let i = 0; i < 4; i++) setTimeout(() => this.cue('join', i), i * 220); },\n      onReset: () => { this.setState({ sel: 0, ore: 4, built: [2, 0, 0, 0] }); this.cue('back'); },\n      selRot: sel * 90,\n      selName: cur.name,\n      selDesc: cur.desc,\n      ore,\n      ...wedge(0),\n      ...wedge(1),\n      ...wedge(2),\n      ...wedge(3),\n      bgVoid: bg === 'void',\n      bgAurora: bg === 'aurora',\n      bgGalaxy: bg === 'galaxy',\n      bgNebula: bg === 'nebula',\n      bgSolar: bg === 'solar system',\n      accTint: rgba(pal[1] ?? pal[0], 0.26),\n      accTintSoft: rgba(pal[0], 0.16),\n      accHi: pal[0] ?? '#FFFFFF',\n      acc: pal[1] ?? pal[0] ?? '#b6bfca',\n      accLo: pal[2] ?? pal[1] ?? '#8b95a2',\n      accFill: pal[3] ?? '#454e5a',\n      showSoundSpec: this.props.showSoundSpec ?? true,\n    };\n  }\n}<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
