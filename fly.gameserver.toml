# fly.gameserver.toml — the authoritative match-server fleet. OWNER: Netcode
# Engineer (docs/hosting-plan.md, Task 11; GDD §4.2).
#
# One region, one image: the plain Dockerized Node process from server/Dockerfile
# (zero vendor-specific APIs — the portability contract, GDD §4.2 risk 1). Fly's
# anycast edge terminates TLS and gives us `wss://` for free at the app hostname,
# with no caddy/traefik and no certificate to distribute — the concrete thing
# this host choice buys over the €4 VPS (docs/hosting-plan.md §1).
#
# Deploy / redeploy: see server/README.md → "Deploying to Fly.io". A redeploy of
# a fleet holding live matches must cordon-and-drain first (POST /drain), never
# hard-restart — that is what the `[deploy] strategy` and the drain route are for.
#
# TICKET_SECRET is NOT in this file. It is a secret, set once with
#   fly secrets set --app planet-rush-gameserver TICKET_SECRET=<value>
# and it MUST equal the allocator's ALLOCATOR_SECRET (allocator signs the ticket,
# this server verifies it). Both apps fail closed, so a mismatch refuses every
# join with no other symptom (docs/hosting-plan.md, Task 11).

app = "planet-rush-gameserver"
primary_region = "iad"

[build]
  # Build context is the repository root (the Dockerfile COPYs src/ and server/).
  dockerfile = "server/Dockerfile"

[env]
  HOST = "::"
  PORT = "8080"
  # Where each Machine beats its rooms + load. Fly 6PN private DNS: `.internal`
  # resolves to the allocator's Machine(s) on the port it listens on. Presence of
  # this var is what makes a Machine a *fleet member* (server/index.ts) rather
  # than a solo server — it joins the fleet and heartbeats.
  ALLOCATOR_URL = "http://planet-rush-allocator.internal:8080"
  # Identity (MACHINE_ID / REGION) is left unset on purpose: server/heartbeat.ts
  # falls back to Fly's own FLY_MACHINE_ID / FLY_REGION, which Fly injects into
  # every Machine at runtime. One less thing to keep in sync per Machine.
  #
  # Arm the socket-hop machine-pin (M10). Behind Fly's anycast edge a client dials
  # one shared hostname and the edge lands the WS upgrade on *some* Machine — a coin
  # flip that landed on the wrong one 3/6 of the time in the Director's wire probe,
  # each miss a `joinError: bad-ticket`. With this set, server/index.ts arms the
  # `beforeUpgrade` guard (server/upgrade-router.ts): a wrong-Machine upgrade is
  # answered with `fly-replay instance=<host>` *before* the handshake, so the edge
  # re-delivers it to the Machine the room's ticket names. The allocator side of the
  # same seam is already armed (fly.allocator.toml ALLOCATOR_ROUTER = "fly"); this is
  # the missing half — without it the pin code ships but never fires, and the lottery
  # stands. Off Fly (the €4 VPS, solo, every direct-dial test) this is simply unset
  # and every upgrade completes locally, exactly as before.
  MATCH_ROUTER = "fly"

  # How many rooms this Machine advertises to the allocator, which packs
  # seat-weighted against it — so this is a promise, not an ambition.
  #
  # MEASURED (m11-01, docs/server-capacity.md), not assumed: a full 8-seat room
  # (1 human + 7 Hard bots, real sockets, 30 Hz snapshots) costs ~4.7 ms of CPU
  # per second. The [[vm]] below is a shared-cpu-1x, metered at 6.25% of a core
  # SUSTAINED = 62.5 ms/s; burst above that runs on credit and a match is a
  # twelve-minute sustained load, so burst is margin, not capacity. At 70% of
  # quota, less the ~5.9 ms/s the empty process draws, 8 rooms fit — less a 25%
  # margin, 6. The previous advertised 32 was ~4× the truth: it came from a
  # sim-only measurement compared against one WHOLE core's frame budget rather
  # than against this guest's quota.
  #
  # Set here explicitly rather than left to DEFAULT_MAX_ROOMS so the number is
  # visible at the deploy, and so changing guest size is a two-line diff:
  #
  #   guest            sustained quota   rooms   $/mo (iad)   $/room
  #   shared-cpu-1x    6.25% of a core       8      $3.19      $0.40   ← today
  #   shared-cpu-2x    12.5%                17      $3.89      $0.23
  #   shared-cpu-4x    25%                  35      $7.78      $0.22
  #   performance-1x   100%                147     $31.00      $0.21
  #
  # (advertise the room count less the 25% margin: 6 / 12 / 26 / 110.)
  # docs/server-capacity.md §3 makes the recommendation — shared-cpu-2x is 22%
  # more money for 2.1× the rooms — but the guest size is the developer's call,
  # so this file still deploys shared-cpu-1x and advertises honestly for it.
  MAX_ROOMS = "6"

[http_service]
  internal_port = 8080
  # wss:// at the edge: redirect any plain-http dial up to https/wss.
  force_https = true

  # This fleet's lifecycle belongs to the fleet controller (allocator/), which
  # cordons and drains a Machine before removing it. Fly's autostop would evict a
  # Machine mid-match, and two systems starting Machines is worse than either one
  # (docs/hosting-plan.md, Task 11) — so BOTH are OFF.
  auto_stop_machines = false
  auto_start_machines = false

  # Two always-on Machines, never one: a single region has no fallback anywhere,
  # so one Machine would make the whole game a single point of failure. NOTE: with
  # auto_stop_machines OFF this floor is advisory to Fly (it only clamps autostop),
  # so the real always-on count is established by deploying two Machines —
  #   fly scale count 2 --app planet-rush-gameserver
  # min_machines_running records the intent and takes effect the day autostop is
  # ever turned on. `fly deploy` may warn that it has no effect today; that is
  # expected, not a misconfiguration.
  min_machines_running = 2

  # Fly's own liveness probe. /health is plain HTTP (never WebSocket) and returns
  # 200 even while draining, so a cordoned Machine that is finishing its matches
  # still reads healthy and is not culled out from under live players.
  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"

# Guest size mirrors allocator/provider-fly.ts DEFAULT_GUEST.
#
# The old note here read "ample for one process holding ≤64 rooms". It is not,
# and the correction is the whole of m11-01 (docs/server-capacity.md): a shared
# CPU is metered at 6.25% of a core sustained, and 6.25% of a core holds EIGHT
# rooms, not 64. Memory was never the constraint and is not one now — a room is
# ~1.2 MB measured, so these 512 MB would hold ~290 rooms and the CPU quota stops
# it at 8. See MAX_ROOMS above for the size/cost table; going up a size is the
# cheapest capacity on the board and is the developer's call, not this file's.
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

# Live matches must survive a redeploy: roll Machines one at a time, and only
# after the operator has drained them (server/README.md). Never restart the whole
# fleet at once.
[deploy]
  strategy = "rolling"
